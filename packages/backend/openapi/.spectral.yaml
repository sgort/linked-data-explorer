# packages/backend/openapi/.spectral.yaml
#
# Lints the built openapi.json (npm run lint:openapi) against the NL API Design
# Rules 2.2.1 ruleset vendored beside this file. Every rule in it gates except
# the exceptions below. Each one states its reason and is scoped as narrowly as
# the rule allows; add one only with a reason a reviewer can check.

extends:
  - ./adr-ruleset-2.2.1.yaml

rules:
  # The release version is calendar-based, YYYY.MM.N with a zero-padded month
  # (2026.09.4), and info.version is the same string as the API-Version header.
  # A zero-padded month is not valid semver, and rewriting it in the document
  # would make the document and the header disagree.
  nlgov:semver: 'off'

overrides:
  # GET /ropa/public takes one parameter, a free-text substring filter on the
  # controller name. No value is invalid, the handler never answers 400, and
  # the document does not claim it can.
  - files:
      - 'openapi.json#/paths/~1ropa~1public/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # DELETE /cache/clear takes one optional parameter, a free-text endpoint whose
  # empty value means "all". No value is invalid, so the handler never answers 400.
  - files:
      - 'openapi.json#/paths/~1cache~1clear/delete'
    rules:
      nlgov:problem-invalid-input: 'off'

  # GET /norms names two query parameters in snake_case (applicable_date,
  # cprmv_version). Renaming them would break existing callers, so the document
  # describes them as they are.
  - files:
      - 'openapi.json#/paths/~1norms/get'
    rules:
      nlgov:query-keys-camel-case: 'off'

  # GET /dmns/{identifier}/xml never answers 400: its only parameter is the
  # `identifier` path segment, passed straight to Operaton unchecked, and it
  # resolves to 200 or 404, never a validation failure. Every other read in
  # this file used to share this exemption for its optional `endpoint`
  # parameter, but #142 now checks that parameter before use and each
  # documents its own 400 (see the operations themselves).
  - files:
      - 'openapi.json#/paths/~1dmns~1%7Bidentifier%7D~1xml/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # GET /process/{key}/variable-hints takes one path parameter, the process
  # definition key. An empty key does not match the route at all (404, not
  # this operation); any non-empty value is passed straight through to
  # Operaton unchecked, so the handler never answers 400 itself.
  - files:
      - 'openapi.json#/paths/~1process~1%7Bkey%7D~1variable-hints/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # GET /chains/templates and GET /chains/templates/{id} take only free-text
  # query parameters (category, tag, endpoint) and, on the by-id read, a path
  # id. No value of any of them is invalid: an unmatched category/tag/id
  # falls through to an empty list (list) or a 404 (by-id), never a 400.
  - files:
      - 'openapi.json#/paths/~1chains~1templates/get'
      - 'openapi.json#/paths/~1chains~1templates~1%7Bid%7D/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # #150 landed validation for the four Assets/ROPA upserts, the deploy-mark
  # PATCH, and DELETE /assets/ropa/{id} (which now checks its id is
  # UUID-shaped before it reaches Postgres, answering 400 for a malformed one
  # -- see assets.routes.ts / ropa.routes.ts). What remains below still
  # genuinely cannot answer 400, for a reason that has nothing to do with
  # "not implemented yet":
  # - the two by-bpmn-id lookups take free text -- any string is a
  #   legitimate lookup key, so a miss is a 404, never a 400;
  # - the three remaining deletes (BPMN, forms, documents) key on a TEXT
  #   column (`lde_id`, or the table's own TEXT primary key), never a UUID,
  #   so there is no malformed shape to reject -- and a delete of a row that
  #   does not exist stays 200 for all four deletes, ROPA included, by
  #   design (decision 3 in the plan), not an omission.
  - files:
      - 'openapi.json#/paths/~1assets~1bpmn~1by-bpmn-id~1%7BbpmnProcessId%7D/get'
      - 'openapi.json#/paths/~1assets~1bpmn~1%7Bid%7D/delete'
      - 'openapi.json#/paths/~1assets~1forms~1%7Bid%7D/delete'
      - 'openapi.json#/paths/~1assets~1documents~1%7Bid%7D/delete'
      - 'openapi.json#/paths/~1assets~1ropa~1by-bpmn-id~1%7BbpmnProcessId%7D/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # Phase 5's (#137) shared list of operations that never answer 400, one
  # block for the whole phase rather than one per task.
  #
  # Seven DSO operations. The two list operations (activiteiten, begrippen)
  # accept every parameter unvalidated and forward it to the upstream API as
  # given. The two URN reads (activiteiten/{urn}, werkzaamheden/{urn}) fall
  # through a malformed path segment to the same 502 as any other upstream
  # failure, rather than answering 400. The three toepasbare-regels per-id
  # reads (sttr, dmn, form-scaffold) take an opaque `id` path parameter that
  # is never validated either — any value is forwarded to the upstream API
  # as given, and a miss maps to 404, not 400. None of the four DSO POSTs
  # (activiteiten/oin, activiteiten/zoek, werkzaamheden/suggereer,
  # werkzaamheden/zoek) needs an entry here any more: two already validated
  # their own input and documented a 400, and since #143 all four document
  # one anyway, for the malformed-body case every body-taking operation
  # shares.
  #
  # One eDOCS operation. GET /edocs/workspaces/{workspaceId}/documents takes
  # an opaque `workspaceId` path parameter that is never validated — an
  # unknown workspace maps to an empty list (200), not 400. The other three
  # eDOCS operations need no entry: `GET /edocs/status` takes no parameter at
  # all, so the rule never applies to it, and the two POSTs validate their
  # own input and document the 400 they answer. GET /vendors and
  # GET /vendors/dmn/{identifier} used to share this exemption for their
  # optional `endpoint` parameter, but #142 now checks it before use and
  # both document their own 400.
  - files:
      - 'openapi.json#/paths/~1dso~1activiteiten/get'
      - 'openapi.json#/paths/~1dso~1activiteiten~1%7Burn%7D/get'
      - 'openapi.json#/paths/~1dso~1begrippen/get'
      - 'openapi.json#/paths/~1dso~1werkzaamheden~1%7Burn%7D/get'
      - 'openapi.json#/paths/~1dso~1toepasbare-regels~1%7Bid%7D~1sttr/get'
      - 'openapi.json#/paths/~1dso~1toepasbare-regels~1%7Bid%7D~1dmn/get'
      - 'openapi.json#/paths/~1dso~1toepasbare-regels~1%7Bid%7D~1form-scaffold/get'
      - 'openapi.json#/paths/~1edocs~1workspaces~1%7BworkspaceId%7D~1documents/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # Two Ozon (Omgevingsdocumenten Presenteren) reads, added alongside the
  # activity dossier. Both take an opaque `id` path parameter (a regeling's
  # identificatie, converted to Ozon's underscore-separated path id) that is
  # never validated — any value is forwarded to the upstream API as given,
  # and a miss maps to 404, not 400. The annotaties read's optional
  # `geldigOp` query parameter is handled the same way, and the
  # documentstructuur read's extra `wId` path parameter is equally opaque.
  - files:
      - 'openapi.json#/paths/~1dso~1regelingen~1%7Bid%7D~1annotaties/get'
      - 'openapi.json#/paths/~1dso~1regelingen~1%7Bid%7D~1documentstructuur~1%7BwId%7D/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # GET /dso/activiteiten/{urn}/dossier used to document a 400 for a national
  # activity requested without an `authority` parameter. That guard was a
  # defect (it rejected every mnre URN, including ones needing no authority
  # at all) and has been removed: the route now falls through a bad URN, a
  # missing authority, or any other upstream shape to 404 or 502, the same
  # as the two URN reads above. `authority` and `datum` are both unvalidated
  # pass-throughs, like `datum` on the plain activity read.
  - files:
      - 'openapi.json#/paths/~1dso~1activiteiten~1%7Burn%7D~1dossier/get'
    rules:
      nlgov:problem-invalid-input: 'off'

  # Every error response is RFC 9457 problem details (#131), so
  # use-problem-schema and problem-schema-members gate everywhere except the
  # two responses below, which are not ours to reshape.
  #
  # GET /health's 503 body is the health document itself, carrying which
  # dependency is down -- the same information a 200 reports, not an
  # explanation of a request failure. Replacing it with problem details would
  # discard the reason the status exists.
  - files:
      - 'openapi.json#/paths/~1health/get/responses/503/content'
    rules:
      nlgov:use-problem-schema: 'off'

  # POST /dmns/evaluate/{decisionKey} is a byte-for-byte proxy for Operaton's
  # own evaluate endpoint; the frontend reads Operaton's raw response body
  # directly. Rewriting a failure into problem details would make the proxy
  # lie about what Operaton said. Only the 500 is listed: the 400 needs no
  # exception, because it also carries problem+json for the one sub-case that
  # is not the proxy's own (a malformed request body, #143, answered by the
  # global error handler before this route is reached), and that satisfies
  # the rule on its own.
  - files:
      - 'openapi.json#/paths/~1dmns~1evaluate~1%7BdecisionKey%7D/post/responses/500/content'
    rules:
      nlgov:use-problem-schema: 'off'
