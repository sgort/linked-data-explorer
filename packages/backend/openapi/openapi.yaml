# packages/backend/openapi/openapi.yaml
#
# The OpenAPI description of the Linked Data Explorer backend, written by hand
# (#129). Served as JSON at /v1/openapi.json. scripts/build-openapi.cjs builds
# openapi.json from this file and sets info.version from package.json, so this
# file must not set info.version.
#
# Every /v1 route must appear here: src/openapi/coverage.test.ts fails when a
# served operation is missing from this file, or when this file describes an
# operation no route serves. Route tests check real responses against it
# (expectToMatchOperation).
#
# During `npm run dev` the document is built once (predev), the route caches it,
# and nodemon does not watch this file: after editing it, run
# `npm run build:openapi` and restart the dev server.
openapi: '3.1.0'
info:
  title: Linked Data Explorer Backend
  description: >-
    DMN discovery and chain execution, SHACL validation, asset storage and
    integrations for the Linked Data Explorer.

    Every 4xx/5xx response is `application/problem+json` (RFC 9457,
    schema `Problem`): `status`, `title` and `detail` always; `code`, the
    machine-readable identifier existing callers branch on, where the
    handler sets one. Two operations are deliberate exceptions, each noted
    at its own response: `POST /dmns/evaluate/{decisionKey}` is a byte-for-byte
    proxy for Operaton's own evaluate endpoint and passes Operaton's error
    body through unchanged (or answers `OperatonProxyError` when Operaton
    could not be reached at all), and `GET /health`'s 503 body is the health
    document itself, not a problem response, because the document *is* the
    explanation. https://github.com/sgort/linked-data-explorer/issues/131.
  contact:
    name: Steven Gort
    email: steven.gort@ictu.nl
    url: https://iou-architectuur.open-regels.nl/
servers:
  - url: https://backend.linkeddata.open-regels.nl/v1
    description: Production
  - url: https://acc.backend.linkeddata.open-regels.nl/v1
    description: Acceptance
tags:
  - name: Health & monitoring
    description: Whether this instance, its build and its dependencies are working.
  - name: Discovery
    description: What the API and its data offer.
  - name: Validation
    description: Checking uploaded data against shape or schema constraints before publish.
  - name: Execution
    description: Composing, running and inspecting DMN chains and BPMN processes.
  - name: Assets
    description: >-
      Published processes and records of processing activities, and the BPMN,
      form, document and RoPA storage behind them.
  - name: Integrations
    description: >-
      Bridges to external systems: DSO activity, concept and rule search, the
      OpenText eDOCS document management bridge, and vendor implementation
      discovery.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health & monitoring]
      summary: Service health, build and dependency status
      description: >-
        200 when TriplyDB and Operaton are reachable, 503 otherwise. An
        incomplete SHACL shape set or an untracked build is reported in the body
        but never changes the status.
      responses:
        '200':
          description: Healthy.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: >-
            Degraded (a dependency is down) or unhealthy (the check itself
            failed; `error` says why).
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.json:
    get:
      operationId: getOpenApiDescription
      tags: [Discovery]
      summary: This OpenAPI description
      description: >-
        The published contract of this API (/core/publish-openapi). Served with
        `Access-Control-Allow-Origin: *`, so any OpenAPI viewer can load it.
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            Access-Control-Allow-Origin:
              description: Always `*`.
              schema:
                type: string
                const: '*'
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    const: '3.1.0'
        '500':
          description: The document could not be read.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /ropa/public:
    get:
      operationId: listPublicRopaRecords
      tags: [Assets]
      summary: Active records of processing activities (GDPR Article 30)
      description: >-
        Public and read-only, with open CORS. Returns active records only,
        without the controller contact, the DPO contact or the schema version.
      parameters:
        - name: organisation
          in: query
          required: false
          description: Case-insensitive substring match on the controller name.
          schema:
            type: string
      responses:
        '200':
          description: The active records, most recently updated first.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicRopaRecord'
        '500':
          description: The records could not be read.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bundles/public:
    get:
      operationId: listPublicBundles
      tags: [Assets]
      summary: Deployed BPMN bundles with their forms, documents and subprocesses
      description: >-
        Public and read-only, with open CORS. Returns shell and standalone
        processes that have been deployed, most recently deployed first.
      responses:
        '200':
          description: The deployed bundles.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicBundle'
        '500':
          description: The bundles could not be read.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/bpmn:
    get:
      operationId: listBpmn
      tags: [Assets]
      summary: List stored BPMN process definitions
      description: >-
        Every row the table holds, most recently updated first — no
        pagination and no filtering.
      responses:
        '200':
          description: The stored process definitions, most recently updated first.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bpmn'
        '500':
          description: The read failed (code LIST_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/bpmn` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: upsertBpmn
      tags: [Assets]
      summary: Create or update a BPMN process definition
      description: >-
        Upserts by `id` (stored as `lde_id`): inserts a new row, or on a
        conflict updates every column named below. `readonly` and
        `schemaVersion` are never written by this operation and keep their
        database defaults (`false` and `1`) on insert, and are left
        unchanged on an update. Nothing in the body is validated: a value a
        database CHECK constraint rejects (`processRole`, `status`), or a
        required column left empty, answers 500, never 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Passed straight to the database with no validation; the
                fields below are what a successful upsert needs, not what
                is enforced before that point.
              required: [id, name, xml, linkedDmnTemplates, createdAt, updatedAt]
              properties:
                id:
                  type: string
                  description: Stored as `lde_id`.
                bpmnProcessId:
                  type: string
                  default: unknown
                  description: Defaults to the literal `"unknown"` when omitted.
                name:
                  type: string
                description:
                  type: string
                xml:
                  type: string
                  description: The BPMN 2.0 XML. Not parsed or validated server-side.
                processRole:
                  type: string
                  enum: [shell, subprocess, standalone]
                  default: standalone
                  description: Database CHECK constraint; an out-of-set value answers 500.
                calledElement:
                  type: string
                shellId:
                  type: string
                linkedDmnTemplates:
                  type: array
                  items:
                    type: string
                  description: >-
                    Not defaulted server-side: an omitted value is stored as
                    NULL against a NOT NULL column and answers 500.
                status:
                  type: string
                  enum: [example, wip, e2e]
                  default: wip
                  description: Database CHECK constraint; an out-of-set value answers 500.
                language:
                  type: string
                  maxLength: 2
                organization:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: The process definition was created or updated. The response carries no data.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: >-
            The write failed (code UPSERT_FAILED) — for example a database
            CHECK or NOT NULL violation — or the request body was not valid
            JSON or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/bpmn` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/bpmn/by-bpmn-id/{bpmnProcessId}:
    get:
      operationId: getBpmnByBpmnProcessId
      tags: [Assets]
      summary: Resolve a BPMN process by its business process id
      description: >-
        Resolves a calledElement reference to its subprocess XML for bundle
        assembly. Looks up by `bpmnProcessId` (the BPMN-internal business
        key), not the storage id the other four operations use. Returns a
        narrower shape than the list operation — only `id`, `bpmnProcessId`
        and `xml` — not the full record.
      parameters:
        - name: bpmnProcessId
          in: path
          required: true
          description: >-
            The BPMN process id to resolve. Any string is accepted; a value
            matching no row answers 404, never 400.
          schema:
            type: string
      responses:
        '200':
          description: The process was found.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/BpmnLookupResult'
        '404':
          description: >-
            No process has this bpmnProcessId (code NOT_FOUND). The message
            quotes the requested id verbatim.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The lookup failed (code LOOKUP_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/bpmn` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/bpmn/{id}:
    delete:
      operationId: deleteBpmn
      tags: [Assets]
      summary: Delete a stored BPMN process definition
      description: >-
        Deletes by `id` (`lde_id`). The delete statement is unconditional —
        an id matching no row still answers 200, never 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The storage id (`lde_id`) to delete.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The delete ran. The response carries no data and does not say
            whether a row was actually removed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: The delete failed (code DELETE_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/bpmn` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/bpmn/{id}/deploy:
    patch:
      operationId: markBpmnDeployed
      tags: [Assets]
      summary: Record a BPMN process deployment
      description: >-
        Marks a stored process as deployed to Operaton. `deployedAt` is
        always set to the server clock; it is never read from the request.
        An id matching no stored process answers 404 rather than a silent
        200 (#155) — the underlying `UPDATE` can match zero rows, and a 200
        for that case used to be indistinguishable from an actual write.
      parameters:
        - name: id
          in: path
          required: true
          description: The storage id (`lde_id`) to mark as deployed.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                Nothing here is required for a 200: an empty body, or no
                body at all, still succeeds, since every field is either
                optional or defaulted.
              properties:
                deploymentId:
                  type: string
                  description: >-
                    Stored as-is, not validated. Omitted, it is written as
                    NULL — the column has no NOT NULL constraint, so this
                    still succeeds.
                operatonUrl:
                  type: string
                  description: Omitted, stored as NULL.
                formIds:
                  type: array
                  items:
                    type: string
                  default: []
                  description: Defaults to an empty array when omitted.
                documentIds:
                  type: array
                  items:
                    type: string
                  default: []
                  description: Defaults to an empty array when omitted.
                boardOwner:
                  type: string
                  description: >-
                    Omitted, the existing stored value is left untouched
                    rather than overwritten to NULL — unlike every other
                    field here, which always overwrites.
      responses:
        '200':
          description: The deployment was recorded. The response carries no data.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '404':
          description: >-
            No process has this id (code NOT_FOUND) — the `UPDATE` matched
            zero rows. The message quotes the requested id verbatim (#155).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The update failed (code DEPLOY_MARK_FAILED), or the request body
            was not valid JSON or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/bpmn` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/forms:
    get:
      operationId: listForms
      tags: [Assets]
      summary: List stored form schemas
      description: >-
        Every row the table holds, most recently updated first — no
        pagination and no filtering.
      responses:
        '200':
          description: The stored form schemas, most recently updated first.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Form'
        '500':
          description: The read failed (code LIST_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/forms` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: upsertForm
      tags: [Assets]
      summary: Create or update a form schema
      description: >-
        Upserts by `id`: inserts a new row, or on a conflict updates every
        column named below. `readonly` is never written by this operation;
        the response always reports it as `false`, hardcoded by the mapper,
        not read from the database. A schema version is stored for a form, but
        neither this operation nor `GET /assets/forms` writes or reads it, so
        it never appears on the wire — unlike `Document.schemaVersion`, which
        does. Nothing in the body is
        validated: a required column left empty, or an over-length
        `language`/`organization`, answers 500, never 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Passed straight to the database with no validation; the
                fields below are what a successful upsert needs, not what
                is enforced before that point.
              required: [id, name, schema, createdAt, updatedAt]
              properties:
                id:
                  type: string
                  description: Stored as the table's TEXT primary key — not a UUID.
                name:
                  type: string
                description:
                  type: string
                schema:
                  type: object
                  description: >-
                    Free-form JSON Schema-like form definition,
                    `JSON.stringify`'d before storage; nothing checks its
                    shape. A JSONB column — the driver returns it already
                    parsed, not a JSON-encoded string.
                status:
                  type: string
                  default: wip
                  description: No database CHECK constraint; any string is accepted.
                language:
                  type: string
                  maxLength: 2
                organization:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: The form schema was created or updated. The response carries no data.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: >-
            The write failed (code UPSERT_FAILED) — for example a NOT NULL
            violation — or the request body was not valid JSON or over
            10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/forms` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/forms/{id}:
    delete:
      operationId: deleteForm
      tags: [Assets]
      summary: Delete a stored form schema
      description: >-
        Deletes by `id`. The delete statement is unconditional — an id
        matching no row still answers 200, never 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The storage id to delete.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The delete ran. The response carries no data and does not say
            whether a row was actually removed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: The delete failed (code DELETE_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/forms` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/documents:
    get:
      operationId: listDocuments
      tags: [Assets]
      summary: List stored document templates
      description: >-
        Every row the table holds, most recently updated first — no
        pagination and no filtering.
      responses:
        '200':
          description: The stored document templates, most recently updated first.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
        '500':
          description: The read failed (code LIST_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/documents` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: upsertDocument
      tags: [Assets]
      summary: Create or update a document template
      description: >-
        Upserts by `id`: inserts a new row, or on a conflict updates every
        column named below. `readonly` is never written by this operation;
        the response always reports it as `false`, hardcoded by the mapper,
        not read from the database. `schemaVersion`, `bindings` and `assets`
        each have a database default (`1` and `'[]'` respectively), but this
        operation always supplies a value for all three explicitly, even
        when the caller omits them from the body — an omitted value becomes
        the JavaScript value `undefined`, which the Postgres driver sends as
        SQL NULL, and NULL is rejected by each column's NOT NULL constraint.
        The database default therefore never actually applies through this
        route; omitting any of the three answers 500, not a defaulted value.
        Nothing in the body is validated: a required column left empty, or
        an over-length `language`/`organization`, answers 500, never 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Passed straight to the database with no validation; the
                fields below are what a successful upsert needs, not what
                is enforced before that point.
              required: [id, name, schemaVersion, zones, bindings, assets, createdAt, updatedAt]
              properties:
                id:
                  type: string
                  description: Stored as the table's TEXT primary key — not a UUID.
                name:
                  type: string
                description:
                  type: string
                processKey:
                  type: string
                serviceId:
                  type: string
                schemaVersion:
                  type: integer
                  description: >-
                    The database column defaults to `1`, but that default
                    never applies through this route (see above) — omitting
                    this answers 500.
                zones:
                  type: object
                  description: >-
                    Free-form JSON, `JSON.stringify`'d before storage;
                    nothing checks its shape. A JSONB column with no
                    database default — the driver returns it already
                    parsed, not a JSON-encoded string.
                bindings:
                  description: >-
                    Free-form JSON, arrays by convention but not enforced.
                    The database column defaults to `[]`, but that default
                    never applies through this route (see above) — omitting
                    this answers 500.
                assets:
                  description: >-
                    Free-form JSON, arrays by convention but not enforced.
                    Same database-default caveat as `bindings`.
                status:
                  type: string
                  default: wip
                  description: No database CHECK constraint; any string is accepted.
                language:
                  type: string
                  maxLength: 2
                organization:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: The document template was created or updated. The response carries no data.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: >-
            The write failed (code UPSERT_FAILED) — for example a NOT NULL
            violation — or the request body was not valid JSON or over
            10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/documents` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [Assets]
      summary: Delete a stored document template
      description: >-
        Deletes by `id`. The delete statement is unconditional — an id
        matching no row still answers 200, never 404.
      parameters:
        - name: id
          in: path
          required: true
          description: The storage id to delete.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The delete ran. The response carries no data and does not say
            whether a row was actually removed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: The delete failed (code DELETE_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/documents` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/ropa:
    get:
      operationId: listRopa
      tags: [Assets]
      summary: List stored records of processing activities
      description: >-
        Every row the table holds, most recently updated first — draft and
        archived records included, not only active ones (contrast
        `GET /ropa/public`, which filters to `status = active`).
      responses:
        '200':
          description: The stored RoPA records, most recently updated first.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RopaRecord'
        '500':
          description: The read failed (code LIST_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/ropa` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: upsertRopa
      tags: [Assets]
      summary: Create or update a record of processing activities
      description: >-
        Upserts by `bpmnProcessId`: inserts a new row, or on a conflict with
        an existing `bpmnProcessId` updates every column named below and
        replaces the full set of personal-data fields (deleted and
        re-inserted inside the same transaction). `id`,
        `createdAt` and `updatedAt` are never read from the body — the id
        is database-generated and both timestamps are set by the database
        clock on insert and update, unlike `/assets/forms` and
        `/assets/documents`, where the caller supplies them. Several
        columns have a database default (`thirdCountryTransfers` false,
        `status` draft, `schemaVersion` 1, each personal-data field's
        `specialCategory` false and `sortOrder` 0), but this operation
        always supplies a value for each explicitly, even when the caller
        omits it from the body — an omitted value becomes the JavaScript
        value `undefined`, which the Postgres driver sends as SQL NULL,
        and NULL is rejected by each column's NOT NULL constraint. The
        database default therefore never actually applies through this
        route. Nothing in the body is validated: a value a database CHECK
        constraint rejects (`processLevel`, `status`), a required column
        left empty, or an omitted `personalDataFields` array (iterated
        directly, so a missing array throws before any database call),
        answers 500, never 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Passed straight to the database with no validation; the
                fields below are what a successful upsert needs, not what
                is enforced before that point.
              required:
                - bpmnProcessId
                - processLevel
                - title
                - controllerName
                - controllerContact
                - purpose
                - legalBasisUri
                - legalBasisLabel
                - gdprArticle
                - dataSubjects
                - recipients
                - thirdCountryTransfers
                - retentionPeriod
                - securityMeasures
                - status
                - schemaVersion
                - personalDataFields
              properties:
                bpmnProcessId:
                  type: string
                processLevel:
                  type: string
                  enum: [shell, subprocess]
                  description: Database CHECK constraint; an out-of-set value answers 500.
                title:
                  type: string
                controllerName:
                  type: string
                controllerContact:
                  type: string
                dpoContact:
                  type: string
                purpose:
                  type: string
                legalBasisUri:
                  type: string
                legalBasisLabel:
                  type: string
                gdprArticle:
                  type: string
                dataSubjects:
                  type: string
                recipients:
                  type: string
                thirdCountryTransfers:
                  type: boolean
                thirdCountryDetails:
                  type: string
                retentionPeriod:
                  type: string
                securityMeasures:
                  type: string
                status:
                  type: string
                  enum: [draft, active, archived]
                  description: Database CHECK constraint; an out-of-set value answers 500.
                schemaVersion:
                  type: integer
                personalDataFields:
                  type: array
                  description: >-
                    Replaces the record's full set of personal-data fields.
                    An empty array is valid and deletes any fields the
                    record already had.
                  items:
                    type: object
                    description: >-
                      Distinct from the response's RopaPersonalDataField:
                      no `id` or `ropaRecordId` here — both are
                      database-generated on insert.
                    required:
                      [formId, fieldKey, fieldLabel, dataCategory, specialCategory, sortOrder]
                    properties:
                      formId:
                        type: string
                      fieldKey:
                        type: string
                      fieldLabel:
                        type: string
                      dataCategory:
                        type: string
                        description: No database CHECK constraint; any string is accepted.
                      specialCategory:
                        type: boolean
                      sortOrder:
                        type: integer
      responses:
        '200':
          description: >-
            The record was created or updated. The response carries only
            the record's id, not the full record.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    additionalProperties: false
                    required: [id]
                    properties:
                      id:
                        type: string
                        format: uuid
        '500':
          description: >-
            The write failed (code UPSERT_FAILED) — for example a database
            CHECK or NOT NULL violation, or a missing `personalDataFields`
            array — or the request body was not valid JSON or over 10 MB
            (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/ropa` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/ropa/by-bpmn-id/{bpmnProcessId}:
    get:
      operationId: getRopaByBpmnProcessId
      tags: [Assets]
      summary: Resolve a RoPA record by its BPMN process id
      description: >-
        Looks up the most recently updated record for that BPMN process id.
      parameters:
        - name: bpmnProcessId
          in: path
          required: true
          description: >-
            The BPMN process id to resolve. Any string is accepted; a value
            matching no row answers 404, never 400.
          schema:
            type: string
      responses:
        '200':
          description: The record was found.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RopaRecord'
        '404':
          description: >-
            No RoPA record has this bpmnProcessId (code NOT_FOUND). The
            message quotes the requested id verbatim.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The lookup failed (code LOOKUP_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/ropa` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /assets/ropa/{id}:
    delete:
      operationId: deleteRopa
      tags: [Assets]
      summary: Delete a stored RoPA record
      description: >-
        Deletes by `id`, cascading to its personal-data fields. The delete
        statement is unconditional — an id matching no row still answers
        200, never 404. `id` is a database UUID column: a non-UUID-shaped
        value fails Postgres's implicit cast and answers 500, not 400 or
        404.
      parameters:
        - name: id
          in: path
          required: true
          description: The record id to delete.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The delete ran. The response carries no data and does not say
            whether a row was actually removed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    const: true
        '500':
          description: >-
            The delete failed (code DELETE_FAILED) — including a
            non-UUID-shaped id, which fails the column's implicit cast.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: >-
            The database pool is not configured (code DB_NOT_CONFIGURED).
            Every `/assets/ropa` operation can answer this.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /cache/stats:
    get:
      operationId: getCacheStats
      tags: [Health & monitoring]
      summary: SPARQL result cache statistics per endpoint
      description: >-
        One entry per SPARQL endpoint whose DMN list is currently cached, keyed
        by the endpoint URL. An empty object means nothing is cached.
      responses:
        '200':
          description: The cache statistics.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/CacheStats'
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The statistics could not be read (code CACHE_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /cache/clear:
    delete:
      operationId: clearCache
      tags: [Health & monitoring]
      summary: Clear the SPARQL result cache
      description: >-
        Clears the cache for one endpoint when `endpoint` is given and not empty,
        otherwise for every endpoint.
      parameters:
        - name: endpoint
          in: query
          required: false
          description: SPARQL endpoint URL whose cache to clear. Omitted or empty clears all.
          schema:
            type: string
      responses:
        '200':
          description: The cache was cleared.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [message, endpoint]
                    properties:
                      message:
                        type: string
                        examples: [All caches cleared]
                      endpoint:
                        type: string
                        description: The endpoint whose cache was cleared, or `all`.
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The cache could not be cleared (code CACHE_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /norms:
    get:
      operationId: listNorms
      tags: [Discovery]
      summary: Published rules (norms) with their dataset versions
      description: >-
        Rules published to TriplyDB, optionally filtered by ruleset and
        applicable date, in the vocabulary of the requested CPRMV version. When
        every ruleset in the result has dataset metadata, the response carries
        `ETag` and `Cache-Control: public, max-age=3600`, and a matching
        conditional request is answered 304; otherwise `Cache-Control: no-cache`.
        The `endpoint` override is not validated (#142).
      parameters:
        - name: rulesetid
          in: query
          required: false
          description: Only rules of this ruleset.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
        - name: applicable_date
          in: query
          required: false
          description: Only rules applicable on this date, as YYYY-MM-DD. The shape is checked, not the calendar.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: cprmv_version
          in: query
          required: false
          description: CPRMV vocabulary version for the rule keys.
          schema:
            type: string
            enum: ['0.3.0', '0.3.2', '0.4.1']
            default: '0.3.0'
        - name: endpoint
          in: query
          required: false
          description: SPARQL endpoint URL to query instead of the configured one.
          schema:
            type: string
      responses:
        '200':
          description: The matching rules.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              description: Present when every ruleset in the result has dataset metadata.
              schema:
                type: string
            Last-Modified:
              description: Present with `ETag` when the latest publication date is known.
              schema:
                type: string
            Cache-Control:
              description: '`public, max-age=3600` with `ETag`, otherwise `no-cache`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/NormsResult'
                  timestamp:
                    type: string
                    format: date-time
        '304':
          description: Not modified since the conditional request's `ETag` or date.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              description: The unchanged entity tag.
              schema:
                type: string
            Last-Modified:
              description: Present with `ETag` when the latest publication date is known.
              schema:
                type: string
            Cache-Control:
              description: '`public, max-age=3600`.'
              schema:
                type: string
        '400':
          description: A query parameter is invalid (code INVALID_PARAM).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The rules could not be queried (code QUERY_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /triplydb/query:
    post:
      operationId: queryTriplyDb
      tags: [Discovery]
      summary: Run a SPARQL query against a caller-supplied endpoint
      description: >-
        Forwards `query` to `endpoint` and returns the endpoint's SPARQL JSON
        results beside `success`, without a `data` wrapper. The endpoint is not
        validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, query]
              properties:
                endpoint:
                  type: string
                  description: SPARQL endpoint URL.
                query:
                  type: string
                  description: SPARQL query text.
      responses:
        '200':
          description: The endpoint's results.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SparqlResults'
                  - type: object
                    required: [success]
                    properties:
                      success:
                        const: true
        '400':
          description: '`endpoint` or `query` is missing.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The query failed (no `code`), or the request body was not valid
            JSON (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /triplydb/update-service:
    post:
      operationId: updateTriplyDbService
      tags: [Discovery]
      summary: Sync a TriplyDB service to include every graph of its dataset
      description: >-
        Changes remote state. The caller supplies the TriplyDB instance and its
        credentials, which are not validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, serviceName]
              properties:
                config:
                  $ref: '#/components/schemas/TriplyDbConfig'
                serviceName:
                  type: string
                graphName:
                  type: string
                  description: Echoed back in the response when given.
      responses:
        '200':
          description: The service was updated.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, message, graphCount]
                properties:
                  success:
                    const: true
                  message:
                    type: string
                  graphCount:
                    type: integer
                    minimum: 0
                  graphName:
                    type: string
        '400':
          description: >-
            `config` or `serviceName` is missing, or `config` lacks `baseUrl`,
            `account`, `dataset` or `apiToken`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The update failed (no `code`), or the request body was not valid
            JSON (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /triplydb/list-graphs:
    post:
      operationId: listTriplyDbGraphs
      tags: [Discovery]
      summary: List the graph names of a TriplyDB dataset
      description: The caller supplies the TriplyDB instance and its credentials, which are not validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: '#/components/schemas/TriplyDbConfig'
      responses:
        '200':
          description: The dataset's graph names.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, graphs, count]
                properties:
                  success:
                    const: true
                  graphs:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                    minimum: 0
        '400':
          description: '`config` is missing or lacks `baseUrl`, `account`, `dataset` or `apiToken`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            Listing failed (no `code`), or the request body was not valid
            JSON (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /triplydb/test-connection:
    post:
      operationId: testTriplyDbConnection
      tags: [Discovery]
      summary: Check that a TriplyDB dataset is reachable with the given settings
      description: >-
        Only the presence of `config` is checked; incomplete settings surface as a
        failed connection (503). The target is not validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  description: TriplyDB connection settings (`baseUrl`, `account`, `dataset`, `apiToken`).
      responses:
        '200':
          description: The dataset answered.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, message, status]
                properties:
                  success:
                    const: true
                  message:
                    type: string
                    examples: [Connection successful]
                  status:
                    const: 200
        '400':
          description: '`config` is missing.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The check itself failed (no `code`), or the request body was not
            valid JSON (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The dataset did not answer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /triplydb/assets:
    get:
      operationId: listTriplyDbAssets
      tags: [Discovery]
      summary: List the assets of a dataset on the Open Regels TriplyDB instance
      description: >-
        Queries `https://api.open-regels.triply.cc`. A private dataset needs
        `apiToken`, which this operation takes in the query string (#142).
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
        - name: dataset
          in: query
          required: true
          schema:
            type: string
        - name: apiToken
          in: query
          required: false
          description: Bearer token for a private dataset.
          schema:
            type: string
      responses:
        '200':
          description: The dataset's assets.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, assets, count]
                properties:
                  success:
                    const: true
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TriplyDbAsset'
                  count:
                    type: integer
                    minimum: 0
        '400':
          description: '`account` or `dataset` is missing.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: TriplyDB could not be reached, or answered with its own 500.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: TriplyDB rejected the request; its HTTP status is passed through (for example 403).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /triplydb/health:
    get:
      operationId: getTriplyDbProxyHealth
      tags: [Health & monitoring]
      summary: Liveness of the TriplyDB proxy
      description: Always answers 200 and does not contact TriplyDB.
      responses:
        '200':
          description: The proxy is running.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, timestamp, uptime]
                properties:
                  status:
                    const: ok
                  service:
                    const: triplydb-proxy
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Process uptime in seconds.
  /dmns:
    get:
      operationId: listDmns
      tags: [Discovery]
      summary: DMN decision models published in the knowledge graph
      description: >-
        Results are cached for five minutes per endpoint. The `endpoint` override
        is not validated (#142).
      parameters:
        - name: endpoint
          in: query
          required: false
          description: SPARQL endpoint URL to query instead of the configured one.
          schema:
            type: string
        - name: refresh
          in: query
          required: false
          description: '`true` or `1` bypasses the cache; any other value leaves it in use.'
          schema:
            type: string
      responses:
        '200':
          description: The decision models.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [total, dmns, fromCache]
                    properties:
                      total:
                        type: integer
                        minimum: 0
                      dmns:
                        type: array
                        items:
                          $ref: '#/components/schemas/DmnModel'
                      fromCache:
                        type: boolean
                        description: True unless `refresh` was requested; not a cache-hit indicator.
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The knowledge graph could not be queried (code QUERY_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dmns/semantic-equivalences:
    get:
      operationId: listDmnSemanticEquivalences
      tags: [Discovery]
      summary: Variables of different DMNs linked to the same concept
      description: The `endpoint` override is not validated (#142).
      parameters:
        - name: endpoint
          in: query
          required: false
          description: SPARQL endpoint URL to query instead of the configured one.
          schema:
            type: string
      responses:
        '200':
          description: The equivalences.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SemanticEquivalence'
                  timestamp:
                    type: string
                    format: date-time
        '500':
