# packages/backend/openapi/openapi.yaml
#
# The OpenAPI description of the Linked Data Explorer backend, written by hand
# (#129). Served as JSON at /v1/openapi.json. scripts/build-openapi.cjs builds
# openapi.json from this file and sets info.version from package.json, so this
# file must not set info.version.
#
# Operations not described yet are listed in pending.json;
# src/openapi/coverage.test.ts keeps both in step with the Express routes, and
# route tests check real responses against this file (expectToMatchOperation).
#
# During `npm run dev` the document is built once (predev), the route caches it,
# and nodemon does not watch this file: after editing it, run
# `npm run build:openapi` and restart the dev server.
openapi: '3.1.0'
info:
  title: Linked Data Explorer Backend
  description: >-
    DMN discovery and chain execution, SHACL validation, asset storage and
    integrations for the Linked Data Explorer.

    Error responses use the `{ success: false, error }` envelope described by
    the ErrorEnvelope schema. The move to RFC 9457 problem details is tracked in
    https://github.com/sgort/linked-data-explorer/issues/131.
  contact:
    name: Steven Gort
    email: steven.gort@ictu.nl
    url: https://iou-architectuur.open-regels.nl/
servers:
  - url: https://backend.linkeddata.open-regels.nl/v1
    description: Production
  - url: https://acc.backend.linkeddata.open-regels.nl/v1
    description: Acceptance
tags:
  - name: Health & monitoring
    description: Whether this instance, its build and its dependencies are working.
  - name: Discovery
    description: What the API and its data offer.
  - name: Assets
    description: Published processes and records of processing activities.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health & monitoring]
      summary: Service health, build and dependency status
      description: >-
        200 when TriplyDB and Operaton are reachable, 503 otherwise. An
        incomplete SHACL shape set or an untracked build is reported in the body
        but never changes the status.
      responses:
        '200':
          description: Healthy.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: >-
            Degraded (a dependency is down) or unhealthy (the check itself
            failed; `error` says why).
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.json:
    get:
      operationId: getOpenApiDescription
      tags: [Discovery]
      summary: This OpenAPI description
      description: >-
        The published contract of this API (/core/publish-openapi). Served with
        `Access-Control-Allow-Origin: *`, so any OpenAPI viewer can load it.
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            Access-Control-Allow-Origin:
              description: Always `*`.
              schema:
                type: string
                const: '*'
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    const: '3.1.0'
        '500':
          description: The document could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /ropa/public:
    get:
      operationId: listPublicRopaRecords
      tags: [Assets]
      summary: Active records of processing activities (GDPR Article 30)
      description: >-
        Public and read-only, with open CORS. Returns active records only,
        without the controller contact, the DPO contact or the schema version.
      parameters:
        - name: organisation
          in: query
          required: false
          description: Case-insensitive substring match on the controller name.
          schema:
            type: string
      responses:
        '200':
          description: The active records, most recently updated first.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicRopaRecord'
        '500':
          description: The records could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /bundles/public:
    get:
      operationId: listPublicBundles
      tags: [Assets]
      summary: Deployed BPMN bundles with their forms, documents and subprocesses
      description: >-
        Public and read-only, with open CORS. Returns shell and standalone
        processes that have been deployed, most recently deployed first.
      responses:
        '200':
          description: The deployed bundles.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicBundle'
        '500':
          description: The bundles could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cache/stats:
    get:
      operationId: getCacheStats
      tags: [Health & monitoring]
      summary: SPARQL result cache statistics per endpoint
      description: >-
        One entry per SPARQL endpoint whose DMN list is currently cached, keyed
        by the endpoint URL. An empty object means nothing is cached.
      responses:
        '200':
          description: The cache statistics.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/CacheStats'
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The statistics could not be read (code CACHE_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cache/clear:
    delete:
      operationId: clearCache
      tags: [Health & monitoring]
      summary: Clear the SPARQL result cache
      description: >-
        Clears the cache for one endpoint when `endpoint` is given and not empty,
        otherwise for every endpoint.
      parameters:
        - name: endpoint
          in: query
          required: false
          description: SPARQL endpoint URL whose cache to clear. Omitted or empty clears all.
          schema:
            type: string
      responses:
        '200':
          description: The cache was cleared.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [message, endpoint]
                    properties:
                      message:
                        type: string
                        examples: [All caches cleared]
                      endpoint:
                        type: string
                        description: The endpoint whose cache was cleared, or `all`.
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The cache could not be cleared (code CACHE_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /norms:
    get:
      operationId: listNorms
      tags: [Discovery]
      summary: Published rules (norms) with their dataset versions
      description: >-
        Rules published to TriplyDB, optionally filtered by ruleset and
        applicable date, in the vocabulary of the requested CPRMV version. When
        every ruleset in the result has dataset metadata, the response carries
        `ETag` and `Cache-Control: public, max-age=3600`, and a matching
        conditional request is answered 304; otherwise `Cache-Control: no-cache`.
        The `endpoint` override is not validated (#142).
      parameters:
        - name: rulesetid
          in: query
          required: false
          description: Only rules of this ruleset.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
        - name: applicable_date
          in: query
          required: false
          description: Only rules applicable on this date, as YYYY-MM-DD. The shape is checked, not the calendar.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: cprmv_version
          in: query
          required: false
          description: CPRMV vocabulary version for the rule keys.
          schema:
            type: string
            enum: ['0.3.0', '0.3.2', '0.4.1']
            default: '0.3.0'
        - name: endpoint
          in: query
          required: false
          description: SPARQL endpoint URL to query instead of the configured one.
          schema:
            type: string
      responses:
        '200':
          description: The matching rules.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              description: Present when every ruleset in the result has dataset metadata.
              schema:
                type: string
            Last-Modified:
              description: Present with `ETag` when the latest publication date is known.
              schema:
                type: string
            Cache-Control:
              description: '`public, max-age=3600` with `ETag`, otherwise `no-cache`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/NormsResult'
                  timestamp:
                    type: string
                    format: date-time
        '304':
          description: Not modified since the conditional request's `ETag` or date.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            ETag:
              description: The unchanged entity tag.
              schema:
                type: string
            Cache-Control:
              description: '`public, max-age=3600`.'
              schema:
                type: string
        '400':
          description: A query parameter is invalid (code INVALID_PARAM).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The rules could not be queried (code QUERY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /triplydb/query:
    post:
      operationId: queryTriplyDb
      tags: [Discovery]
      summary: Run a SPARQL query against a caller-supplied endpoint
      description: >-
        Forwards `query` to `endpoint` and returns the endpoint's SPARQL JSON
        results beside `success`, without a `data` wrapper. The endpoint is not
        validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, query]
              properties:
                endpoint:
                  type: string
                  description: SPARQL endpoint URL.
                query:
                  type: string
                  description: SPARQL query text.
      responses:
        '200':
          description: The endpoint's results.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SparqlResults'
                  - type: object
                    required: [success]
                    properties:
                      success:
                        const: true
        '400':
          description: '`endpoint` or `query` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
        '500':
          description: >-
            The query failed (`TriplyDbError`), or the request body was not valid
            JSON (`ErrorEnvelope`, INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TriplyDbError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /triplydb/update-service:
    post:
      operationId: updateTriplyDbService
      tags: [Discovery]
      summary: Sync a TriplyDB service to include every graph of its dataset
      description: >-
        Changes remote state. The caller supplies the TriplyDB instance and its
        credentials, which are not validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, serviceName]
              properties:
                config:
                  $ref: '#/components/schemas/TriplyDbConfig'
                serviceName:
                  type: string
                graphName:
                  type: string
                  description: Echoed back in the response when given.
      responses:
        '200':
          description: The service was updated.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, message, graphCount]
                properties:
                  success:
                    const: true
                  message:
                    type: string
                  graphCount:
                    type: integer
                    minimum: 0
                  graphName:
                    type: string
        '400':
          description: >-
            `config` or `serviceName` is missing, or `config` lacks `baseUrl`,
            `account`, `dataset` or `apiToken`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
        '500':
          description: >-
            The update failed (`TriplyDbError`), or the request body was not valid
            JSON (`ErrorEnvelope`, INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TriplyDbError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /triplydb/list-graphs:
    post:
      operationId: listTriplyDbGraphs
      tags: [Discovery]
      summary: List the graph names of a TriplyDB dataset
      description: The caller supplies the TriplyDB instance and its credentials, which are not validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  $ref: '#/components/schemas/TriplyDbConfig'
      responses:
        '200':
          description: The dataset's graph names.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, graphs, count]
                properties:
                  success:
                    const: true
                  graphs:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                    minimum: 0
        '400':
          description: '`config` is missing or lacks `baseUrl`, `account`, `dataset` or `apiToken`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
        '500':
          description: >-
            Listing failed (`TriplyDbError`), or the request body was not valid
            JSON (`ErrorEnvelope`, INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TriplyDbError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /triplydb/test-connection:
    post:
      operationId: testTriplyDbConnection
      tags: [Discovery]
      summary: Check that a TriplyDB dataset is reachable with the given settings
      description: >-
        Only the presence of `config` is checked; incomplete settings surface as a
        failed connection (503). The target is not validated (#142).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  description: TriplyDB connection settings (`baseUrl`, `account`, `dataset`, `apiToken`).
      responses:
        '200':
          description: The dataset answered.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, message, status]
                properties:
                  success:
                    const: true
                  message:
                    type: string
                    examples: [Connection successful]
                  status:
                    const: 200
        '400':
          description: '`config` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
        '500':
          description: >-
            The check itself failed (`TriplyDbError`), or the request body was not
            valid JSON (`ErrorEnvelope`, INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TriplyDbError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The dataset did not answer. This body uses `message`, not `error`.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, status]
                properties:
                  success:
                    const: false
                  message:
                    type: string
                    examples: [Connection failed]
                  status:
                    const: 503
  /triplydb/assets:
    get:
      operationId: listTriplyDbAssets
      tags: [Discovery]
      summary: List the assets of a dataset on the Open Regels TriplyDB instance
      description: >-
        Queries `https://api.open-regels.triply.cc`. A private dataset needs
        `apiToken`, which this operation takes in the query string (#142).
      parameters:
        - name: account
          in: query
          required: true
          schema:
            type: string
        - name: dataset
          in: query
          required: true
          schema:
            type: string
        - name: apiToken
          in: query
          required: false
          description: Bearer token for a private dataset.
          schema:
            type: string
      responses:
        '200':
          description: The dataset's assets.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, assets, count]
                properties:
                  success:
                    const: true
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TriplyDbAsset'
                  count:
                    type: integer
                    minimum: 0
        '400':
          description: '`account` or `dataset` is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
        '500':
          description: TriplyDB could not be reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
        default:
          description: TriplyDB rejected the request; its HTTP status is passed through (for example 403).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriplyDbError'
  /triplydb/health:
    get:
      operationId: getTriplyDbProxyHealth
      tags: [Health & monitoring]
      summary: Liveness of the TriplyDB proxy
      description: Always answers 200 and does not contact TriplyDB.
      responses:
        '200':
          description: The proxy is running.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, timestamp, uptime]
                properties:
                  status:
                    const: ok
                  service:
                    const: triplydb-proxy
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    description: Process uptime in seconds.
components:
  headers:
    ApiVersion:
      description: Full release version of the API (/core/version-header).
      required: true
      schema:
        type: string
        examples:
          - '2026.09.4'
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        The error body the backend returns today. Not RFC 9457 problem details;
        see https://github.com/sgort/linked-data-explorer/issues/131.
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [LIST_FAILED]
            message:
              type: string
            details:
              type: string
        timestamp:
          type: string
          format: date-time
    Health:
      type: object
      required:
        [name, version, environment, build, status, uptime, timestamp, services, shacl, documentation]
      properties:
        name:
          type: string
        version:
          type: string
          description: Release version; the same value as the API-Version header.
        environment:
          type: string
        build:
          $ref: '#/components/schemas/BuildInfo'
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        uptime:
          type: number
          description: Process uptime in seconds.
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          required: [triplydb, operaton]
          properties:
            triplydb:
              $ref: '#/components/schemas/DependencyStatus'
            operaton:
              $ref: '#/components/schemas/DependencyStatus'
        shacl:
          $ref: '#/components/schemas/ShaclLayerStatus'
        documentation:
          type: string
          examples: [/v1/openapi.json]
        error:
          type: string
          description: Present only when status is unhealthy.
    BuildInfo:
      type: object
      description: >-
        The build this instance runs, recorded in the deploy artifact (#122).
        isTracked is true only when both sha and run are present; otherwise the
        label is "local build".
      required: [sha, shortSha, run, isTracked, label]
      properties:
        sha:
          type: string
          description: Full commit SHA, or empty when untracked.
        shortSha:
          type: string
        run:
          type: string
          description: GitHub Actions run number, or empty when untracked.
        isTracked:
          type: boolean
        label:
          type: string
          examples: ['build 5530720 · #135', local build]
    DependencyStatus:
      type: object
      required: [status, latency, lastCheck]
      properties:
        status:
          type: string
          enum: [up, down, unknown]
        latency:
          type: number
          description: Round trip in milliseconds; 0 when not measured.
        lastCheck:
          type: string
          format: date-time
    ShaclLayerStatus:
      type: object
      description: >-
        Which SHACL shape layers loaded. Reported only; never changes the health
        status. `layers` is present when the status was read, `error` when
        reading it failed, and neither when the health check itself failed
        before reaching it (status unhealthy).
      required: [complete]
      properties:
        complete:
          type: boolean
        layers:
          type: object
          additionalProperties:
            type: object
            required: [label, loaded]
            properties:
              label:
                type: string
              loaded:
                type: boolean
        error:
          type: string
    PublicRopaRecord:
      type: object
      description: >-
        A record of processing activities as published. Closed: internal fields
        such as the controller and DPO contacts are never included.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - processLevel
        - title
        - controllerName
        - purpose
        - legalBasisUri
        - legalBasisLabel
        - gdprArticle
        - dataSubjects
        - recipients
        - thirdCountryTransfers
        - retentionPeriod
        - securityMeasures
        - status
        - personalDataFields
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        bpmnProcessId:
          type: string
        processLevel:
          type: string
          enum: [shell, subprocess]
        title:
          type: string
        controllerName:
          type: string
        purpose:
          type: string
        legalBasisUri:
          type: string
        legalBasisLabel:
          type: string
        gdprArticle:
          type: string
        dataSubjects:
          type: string
        recipients:
          type: string
        thirdCountryTransfers:
          type: boolean
        thirdCountryDetails:
          type: string
          description: Omitted when there are no third-country transfer details.
        retentionPeriod:
          type: string
        securityMeasures:
          type: string
        status:
          type: string
          const: active
        personalDataFields:
          type: array
          items:
            $ref: '#/components/schemas/RopaPersonalDataField'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RopaPersonalDataField:
      type: object
      additionalProperties: false
      required:
        [id, ropaRecordId, formId, fieldKey, fieldLabel, dataCategory, specialCategory, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        ropaRecordId:
          type: string
          format: uuid
        formId:
          type: string
        fieldKey:
          type: string
        fieldLabel:
          type: string
        dataCategory:
          type: string
        specialCategory:
          type: boolean
        sortOrder:
          type: integer
    PublicBundle:
      type: object
      description: A deployed shell or standalone process with its deployed artefacts.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - name
        - processRole
        - linkedDmnTemplates
        - status
        - deployedAt
        - deployedForms
        - deployedDocuments
        - subprocesses
        - updatedAt
      properties:
        id:
          type: string
        bpmnProcessId:
          type: string
        name:
          type: string
        description:
          type: string
        processRole:
          type: string
          enum: [shell, standalone]
        linkedDmnTemplates:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [example, wip, e2e]
        deployedAt:
          type: string
          format: date-time
        operatonUrl:
          type: string
        operatonDeploymentId:
          type: string
        deployedForms:
          type: array
          items:
            $ref: '#/components/schemas/NamedArtefact'
        deployedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/NamedArtefact'
        subprocesses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, bpmnProcessId, status]
            properties:
              id:
                type: string
              name:
                type: string
              bpmnProcessId:
                type: string
              status:
                type: string
                enum: [example, wip, e2e]
        language:
          type: string
          maxLength: 2
        organization:
          type: string
        boardOwner:
          type: string
        updatedAt:
          type: string
          format: date-time
    NamedArtefact:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CacheStats:
      type: object
      description: >-
        SPARQL result cache entries keyed by endpoint URL. `age` is the number of
        seconds since the entry was cached; `count` is the number of cached DMN
        records.
      additionalProperties:
        type: object
        required: [age, count]
        properties:
          age:
            type: integer
            minimum: 0
          count:
            type: integer
            minimum: 0
    NormsResult:
      type: object
      required: [total, dataset_versions, cprmv_version, aggregations, rules]
      properties:
        total:
          type: integer
          minimum: 0
          description: Number of rules in `rules`.
        dataset_versions:
          type: object
          description: Published dataset versions per ruleset id, newest first.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DatasetVersion'
        cprmv_version:
          type: string
          description: The CPRMV version the rule keys use.
          examples: ['0.3.0']
        aggregations:
          type: object
          required: [norms_per_rulesetid]
          properties:
            norms_per_rulesetid:
              type: object
              description: Number of rules per ruleset id.
              additionalProperties:
                type: integer
                minimum: 0
        rules:
          type: array
          description: >-
            Published rules. A rule's keys are IRIs in the requested CPRMV
            version's namespace (for example
            `https://cprmv.open-regels.nl/0.3.0/id`), plus `rulesetid`,
            `applicable_date`, `rulesetid_index`, `rule_id_path` and
            `rule_id_path_key`. A nested `contains` map, keyed by rule id, is
            present when the rule has children. The key set varies by version,
            so rules are described as open objects.
          items:
            type: object
    DatasetVersion:
      type: object
      required: [version, published_at, title]
      properties:
        version:
          type: [string, 'null']
          description: Null for rulesets other than the primary one.
        published_at:
          type: string
          description: Publication date as published in TriplyDB, normally ISO 8601; not reformatted.
        title:
          type: [string, 'null']
          description: Null for rulesets other than the primary one.
    TriplyDbError:
      type: object
      description: >-
        Error body of the TriplyDB proxy routes. Not `ErrorEnvelope`: `error` is a
        plain message and `status` repeats the HTTP status (#131).
      required: [success, error, status]
      properties:
        success:
          const: false
        error:
          type: string
        status:
          type: integer
    TriplyDbConfig:
      type: object
      description: TriplyDB connection settings supplied by the caller (#142).
      required: [baseUrl, account, dataset, apiToken]
      properties:
        baseUrl:
          type: string
          examples: ['https://api.open-regels.triply.cc']
        account:
          type: string
        dataset:
          type: string
        apiToken:
          type: string
    SparqlResults:
      type: object
      description: >-
        SPARQL 1.1 Query Results JSON as returned by the endpoint, unchanged:
        `head` and `results.bindings` for SELECT, `head` and `boolean` for ASK.
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SparqlBinding'
        boolean:
          type: boolean
    SparqlBinding:
      type: object
      required: [value]
      properties:
        type:
          type: string
          examples: [uri]
        value:
          type: string
        datatype:
          type: string
        'xml:lang':
          type: string
    TriplyDbAsset:
      type: object
      required: [id, name, url, size, contentType]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          description: Download URL of the first version, or a constructed page URL when the asset has no versions.
        size:
          type: number
          minimum: 0
          description: Size of the first version in bytes, or 0 when there is none.
        contentType:
          type: string
          description: Always `image/png`; TriplyDB does not report the type.
