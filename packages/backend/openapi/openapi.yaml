          schema:
            type: string
        - name: env
          in: query
          required: false
          description: >-
            `prod` here or in the `x-dso-env` header selects the production
            DSO environment. Any other value in both, including a typo, or
            their absence, selects pre-production.
          schema:
            type: string
        - name: datum
          in: query
          required: false
          description: Date as dd-MM-yyyy. Defaults to today when omitted.
          schema:
            type: string
