            that cannot be percent-decoded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dso/toepasbare-regels:
    get:
      operationId: listDsoToepasbareRegels
      tags: [Integrations]
      summary: Toepasbare-regels metadata for a concept
      description: >-
        Proxies the DSO Uitvoeren Gegevens API. Each returned item exposes
        an `identifier`, used by the three per-regel reads below (`/sttr`,
        `/dmn`, `/form-scaffold`).
      parameters:
        - name: x-dso-env
          in: header
          required: false
          description: >-
            `prod` here or in the `env` query parameter selects the production
            DSO environment. Any other value in both, or their absence,
            selects pre-production. Neither overrides the other.
          schema:
            type: string
        - name: env
          in: query
          required: false
          description: >-
            `prod` here or in the `x-dso-env` header selects the production
            DSO environment. Any other value in both, including a typo, or
            their absence, selects pre-production.
          schema:
            type: string
        - name: functioneleStructuurRef
          in: query
          required: true
          description: >-
            The concept's identifier URI. Repeating this parameter is
            rejected with a 400, the same as omitting it — only a single
            string value is accepted.
          schema:
            type: string
            examples: ['https://identifier.overheid.nl/concept/1']
      responses:
        '200':
          description: The regel metadata for the concept.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    description: The upstream API's response, unchanged.
        '400':
          description: >-
            `functioneleStructuurRef` is missing, or repeated (which arrives
            as an array; only a single string value is accepted).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingRef:
                  value:
                    {
                      type: 'about:blank',
                      status: 400,
                      title: 'Invalid request',
                      detail: 'functioneleStructuurRef is required',
                      instance: '/v1/dso/toepasbare-regels',
                    }
        '404':
          description: No toepasbare regels exist for this `functioneleStructuurRef`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            The upstream API could not be reached, or answered with a
            failure other than "not found".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dso/toepasbare-regels/{id}/sttr:
    get:
      operationId: downloadDsoToepasbareRegelSttr
      tags: [Integrations]
      summary: Raw STTR XML file for a toepasbare regel
      description: >-
        Proxies the DSO Uitvoeren Gegevens API's STTR download unmodified,
        served as an XML attachment rather than the JSON envelope used
        elsewhere in this API.
      parameters:
        - name: x-dso-env
          in: header
          required: false
          description: >-
            `prod` here or in the `env` query parameter selects the production
            DSO environment. Any other value in both, or their absence,
            selects pre-production. Neither overrides the other.
          schema:
            type: string
        - name: env
          in: query
          required: false
          description: >-
            `prod` here or in the `x-dso-env` header selects the production
            DSO environment. Any other value in both, including a typo, or
            their absence, selects pre-production.
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: >-
            The regel's `identifier`, as returned by
            `GET /dso/toepasbare-regels`. Not validated; any value is
            forwarded to the upstream API as given.
          schema:
            type: string
      responses:
        '200':
          description: The raw STTR XML.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            Content-Disposition:
              description: Marks the response as a downloadable attachment.
              schema:
                type: string
                examples: ['attachment; filename="sttr-tr-1.xml"']
          content:
            application/xml:
              schema:
                type: string
                description: The upstream API's STTR XML, unmodified.
        '404':
          description: No toepasbare regel exists for this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            The upstream API could not be reached, or answered with a
            failure other than "not found".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dso/toepasbare-regels/{id}/dmn:
    get:
      operationId: getDsoToepasbareRegelDmn
      tags: [Integrations]
      summary: DMN decision extracted from a toepasbare regel, ready for Operaton
      description: >-
        Extracts the embedded DMN `<definitions>` element from the regel's
        STTR and normalizes it (namespace version, missing element ids,
        FEEL-safe variable names, output types, and a Camunda history
        time-to-live) so it both deploys and evaluates on Operaton. Served
        as an XML attachment rather than the JSON envelope used elsewhere
        in this API.
      parameters:
        - name: x-dso-env
          in: header
          required: false
          description: >-
            `prod` here or in the `env` query parameter selects the production
            DSO environment. Any other value in both, or their absence,
            selects pre-production. Neither overrides the other.
          schema:
            type: string
        - name: env
          in: query
          required: false
          description: >-
            `prod` here or in the `x-dso-env` header selects the production
            DSO environment. Any other value in both, including a typo, or
            their absence, selects pre-production.
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: >-
            The regel's `identifier`, as returned by
            `GET /dso/toepasbare-regels`. Not validated; any value is
            forwarded to the upstream API as given.
          schema:
            type: string
      responses:
        '200':
          description: The extracted, Operaton-ready DMN XML.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
            Content-Disposition:
              description: Marks the response as a downloadable attachment.
              schema:
                type: string
                examples: ['attachment; filename="decision-tr-1.dmn"']
          content:
            application/xml:
              schema:
                type: string
                description: The normalized DMN XML, ready to deploy.
        '404':
          description: No toepasbare regel exists for this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The regel's STTR has no embedded DMN `<definitions>` element to extract.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                noDefinitions:
                  value:
                    {
                      type: 'about:blank',
                      status: 422,
                      title: 'No DMN found',
                      detail: 'No DMN <definitions> element found in STTR XML',
                      instance: '/v1/dso/toepasbare-regels/tr-1/dmn',
                    }
        '502':
          description: >-
            The upstream API could not be reached, or answered with a
            failure other than "not found". Does not cover an STTR with no
            embedded DMN element (422).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dso/toepasbare-regels/{id}/form-scaffold:
    get:
      operationId: getDsoToepasbareRegelFormScaffold
      tags: [Integrations]
      summary: Best-effort form-js field scaffold from a toepasbare regel
      description: >-
        Parses the questionnaire embedded in an indieningsvereisten STTR
        into a form-js field scaffold. Unlike the STTR and DMN reads, this
        responds with the JSON envelope used elsewhere in this API, not a
        file download.
      parameters:
        - name: x-dso-env
          in: header
          required: false
          description: >-
            `prod` here or in the `env` query parameter selects the production
            DSO environment. Any other value in both, or their absence,
            selects pre-production. Neither overrides the other.
          schema:
            type: string
        - name: env
          in: query
          required: false
          description: >-
            `prod` here or in the `x-dso-env` header selects the production
            DSO environment. Any other value in both, including a typo, or
            their absence, selects pre-production.
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: >-
            The regel's `identifier`, as returned by
            `GET /dso/toepasbare-regels`. Not validated; any value is
            forwarded to the upstream API as given.
          schema:
            type: string
        - name: formId
          in: query
          required: false
          description: >-
            The generated scaffold's `id`. Defaults to the path `id` when
            omitted.
          schema:
            type: string
      responses:
        '200':
          description: The generated form-js field scaffold.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [schemaVersion, id, type, components]
                    properties:
                      schemaVersion:
                        const: 17
                      id:
                        type: string
                        description: >-
                          The effective form id: the `formId` query
                          parameter, or the path `id` when omitted.
                      type:
                        const: 'default'
                      components:
                        type: array
                        items:
                          type: object
                          required: [id, type, label, key, validate]
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                              description: >-
                                The form-js field widget the extraction
                                logic chose for this question.
                              enum: [checkbox, select, number, textarea, textfield]
                            label:
                              type: string
                            key:
                              type: string
                            values:
                              type: array
                              description: >-
                                Present only for a `select` field built from
                                a list question that declares options.
                              items:
                                type: object
                                required: [label, value]
                                properties:
                                  label:
                                    type: string
                                  value:
                                    type: string
                            validate:
                              type: object
                              required: [required]
                              properties:
                                required:
                                  const: false
                                  description: >-
                                    Always `false` in the current extraction
                                    logic.
        '404':
          description: No toepasbare regel exists for this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: >-
            The upstream API could not be reached, or answered with a
            failure other than "not found".
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /edocs/status:
    get:
      operationId: getEdocsStatus
      tags: [Integrations]
      summary: eDOCS connectivity status
      description: >-
        Reports whether the OpenText eDOCS document management bridge is
        reachable, and whether the API is currently running against it in
        stub mode. The health check never rejects: an unreachable eDOCS
        server still answers here with **200** and `status: "down"` in the
        body, not a failure status — see the 200 response below.
      responses:
        '200':
          description: >-
            The connectivity status. An upstream outage is reported inside
            this 200 body as `status: "down"` with an `error` message, not as
            a 5xx — there is no scenario in which an eDOCS outage produces a
            non-2xx response from this operation.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [status, stubMode]
                    properties:
                      status:
                        type: string
                        description: >-
                          In practice `up`, `down` or `stub`, but read
                          straight from the health check with nothing
                          enforcing those three values — a free string, not
                          an enum.
                        examples: ['up', 'down', 'stub']
                      stubMode:
                        type: boolean
                        description: >-
                          Whether the API is currently configured to run
                          against a stub instead of a real eDOCS server.
                          Independent of `status`: a stub-mode health check
                          always reports `status: "stub"`.
                      latencyMs:
                        type: number
                        description: >-
                          Round trip of the connectivity check, in
                          milliseconds. Present only when the check measured
                          one; a genuine `0` is kept, not treated as absent.
                      error:
                        type: string
                        description: >-
                          Present only when the connectivity check failed.
                          `status` is `"down"` whenever this is present, and
                          the response is still 200.
              examples:
                up:
                  value: { success: true, data: { status: 'up', stubMode: false, latencyMs: 42 } }
                down:
                  value:
                    {
                      success: true,
                      data:
                        {
                          status: 'down',
                          stubMode: false,
                          error: 'connect ECONNREFUSED',
                        },
                    }
                stub:
                  value: { success: true, data: { status: 'stub', stubMode: true } }
        '500':
          description: >-
            The status route's own handler failed unexpectedly (code
            EDOCS_STATUS_FAILED). Distinct from an eDOCS outage, which is
            reported as a 200 above.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /edocs/workspaces/ensure:
    post:
      operationId: ensureEdocsWorkspace
      tags: [Integrations]
      summary: Find or create an eDOCS workspace for a project
      description: >-
        Searches for an existing workspace whose name starts with
        `projectNumber`; returns it if found, otherwise creates a new one.
        Re-posting the same `projectNumber` is idempotent for this reason —
        it does not create a duplicate workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectNumber, projectName]
              properties:
                projectNumber:
                  type: string
                  description: >-
                    Used as the search key for an existing workspace.
                    Required; rejected with 400 when missing or blank after
                    trimming.
                  examples: ['FL-INF-2025-042']
                projectName:
                  type: string
                  description: >-
                    Required; rejected with 400 when missing or blank after
                    trimming.
                  examples: ['Kapvergunning']
      responses:
        '200':
          description: The existing or newly created workspace.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [workspaceId, workspaceName, created]
                    properties:
                      workspaceId:
                        type: string
                      workspaceName:
                        type: string
                        description: >-
                          Reconstructed as `"<projectNumber> — <projectName>"`
                          when a workspace is created; the existing name as
                          eDOCS itself stores it when one was found instead.
                      created:
                        type: boolean
                        description: >-
                          `true` only when a new workspace was created;
                          `false` when an existing one was found.
              examples:
                created:
                  value:
                    {
                      success: true,
                      data:
                        {
                          workspaceId: 'ws-123',
                          workspaceName: 'FL-INF-2025-042 — Kapvergunning',
                          created: true,
                        },
                    }
        '400':
          description: '`projectNumber` or `projectName` is missing or blank.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingFields:
                  value:
                    {
                      type: 'about:blank',
                      status: 400,
                      title: 'Invalid request',
                      detail: 'projectNumber and projectName are required',
                      instance: '/v1/edocs/workspaces/ensure',
                      code: 'INVALID_INPUT',
                    }
        '500':
          description: >-
            The workspace lookup or creation failed (code
            EDOCS_WORKSPACE_FAILED), or the request body was not valid JSON
            or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /edocs/documents:
    post:
      operationId: uploadEdocsDocument
      tags: [Integrations]
      summary: Upload a document into an eDOCS workspace
      description: >-
        The file content travels as base64 text inside the JSON body rather
        than a multipart upload, so it is bound by the same global JSON body
        limit as every other request (10 MB) — there is no dedicated
        upload-size check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, filename, contentBase64, metadata]
              properties:
                workspaceId:
                  type: string
                  description: Required; rejected with 400 when missing or blank after trimming.
                filename:
                  type: string
                  description: Required; rejected with 400 when missing or blank after trimming.
                  examples: ['beschikking.pdf']
                contentBase64:
                  type: string
                  format: byte
                  description: >-
                    Base64-encoded file content. Required and must be
                    non-empty after trimming, but is otherwise never decoded
                    or format-checked — a non-empty string that is not valid
                    base64 is still accepted and forwarded unchanged.
                metadata:
                  type: object
                  required: [docName]
                  properties:
                    docName:
                      type: string
                      description: Required; rejected with 400 when missing or blank after trimming.
                      examples: ['Beschikking']
                    appId:
                      type: string
                      description: 'Optional; defaults to `''INFRA''` when omitted.'
                    formName:
                      type: string
                      description: Optional.
                    extra:
                      type: object
                      description: >-
                        Optional, arbitrary key/value pairs passed through
                        unchanged as additional profile fields.
                      additionalProperties:
                        type: string
      responses:
        '200':
          description: The uploaded document.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [documentId, documentNumber, workspaceId]
                    properties:
                      documentId:
                        type: string
                      documentNumber:
                        type: string
                        description: Falls back to `documentId` when the upstream response omits it.
                      workspaceId:
                        type: string
                        description: Echoed from the request; not read from the upstream response.
        '400':
          description: >-
            `workspaceId`, `filename`, `contentBase64` or
            `metadata.docName` is missing or blank.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                missingFields:
                  value:
                    {
                      type: 'about:blank',
                      status: 400,
                      title: 'Invalid request',
                      detail: 'workspaceId, filename, contentBase64, and metadata.docName are required',
                      instance: '/v1/edocs/documents',
                      code: 'INVALID_INPUT',
                    }
        '500':
          description: >-
            The upload failed (code EDOCS_UPLOAD_FAILED), or the request
            body was not valid JSON or over 10 MB (code INTERNAL_ERROR;
            #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /edocs/workspaces/{workspaceId}/documents:
    get:
      operationId: listEdocsWorkspaceDocuments
      tags: [Integrations]
      summary: Documents stored in an eDOCS workspace
      description: >-
        `workspaceId` is not validated against known workspaces — any value
        is forwarded to eDOCS as given. A workspace with no documents and a
        `workspaceId` unknown to eDOCS both answer 200 with an empty list;
        this operation never answers 404.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >-
            The workspace's documents. Empty for a workspace with none, and
            equally empty — never a 404 — for a `workspaceId` unknown to
            eDOCS.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [documents, count]
                    properties:
                      documents:
                        type: array
                        items:
                          type: object
                          required: [id, name, documentNumber]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            documentNumber:
                              type: string
                      count:
                        type: integer
                        description: '`documents.length`, computed locally.'
              examples:
                populated:
                  value:
                    {
                      success: true,
                      data:
                        {
                          documents:
                            [
                              { id: 'doc-1', name: 'Aanvraag.pdf', documentNumber: 'FL-2025-001234' },
                            ],
                          count: 1,
                        },
                    }
                empty:
                  value: { success: true, data: { documents: [], count: 0 } }
        '500':
          description: The listing failed (code EDOCS_DOCUMENTS_FAILED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /vendors:
    get:
      operationId: listVendorServices
      tags: [Integrations]
      summary: Vendor services implementing reference DMNs
      description: >-
        Reads vendor implementation services from the knowledge graph via
        SPARQL. Every field beyond `id`, `basedOn` and `provider` comes
        straight from the graph with nothing enforcing its shape or values.
      parameters:
        - name: endpoint
          in: query
          required: false
          description: >-
            SPARQL endpoint URL. Not validated; forwarded as given. Omitted,
            the query runs against this API's configured default endpoint.
          schema:
            type: string
      responses:
        '200':
          description: The vendor services.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [vendorServices, count]
                    properties:
                      vendorServices:
                        type: array
                        items:
                          $ref: '#/components/schemas/VendorService'
                      count:
                        type: integer
                        description: '`vendorServices.length`, computed locally.'
        '500':
          description: The knowledge graph query failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                queryFailed:
                  value:
                    {
                      type: 'about:blank',
                      status: 500,
                      title: 'Vendor request failed',
                      detail: 'SPARQL endpoint timed out',
                      instance: '/v1/vendors',
                    }
  /vendors/dmn/{identifier}:
    get:
      operationId: getVendorServicesForDmn
      tags: [Integrations]
      summary: Vendor services implementing one reference DMN
      description: >-
        Filters the same vendor services as `GET /vendors` in memory —
        this is not a separate SPARQL query — matching `identifier` against
        a vendor's `basedOnIdentifier`, its `basedOn` URI, or a `basedOn`
        URI ending in `/{identifier}/dmn`. An `identifier` matching nothing
        answers 200 with an empty list, never 404.
      parameters:
        - name: identifier
          in: path
          required: true
          description: >-
            A reference DMN identifier or URI. Not validated against known
            DMNs; a value matching none answers 200 with an empty list.
          schema:
            type: string
            examples: ['SVB_LeeftijdsInformatie']
        - name: endpoint
          in: query
          required: false
          description: >-
            SPARQL endpoint URL. Not validated; forwarded as given. Omitted,
            the query runs against this API's configured default endpoint.
          schema:
            type: string
      responses:
        '200':
          description: The vendor services implementing this reference DMN, possibly empty.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [vendorServices, count, dmnIdentifier]
                    properties:
                      vendorServices:
                        type: array
                        items:
                          $ref: '#/components/schemas/VendorService'
                      count:
                        type: integer
                        description: '`vendorServices.length`, computed locally.'
                      dmnIdentifier:
                        type: string
                        description: >-
                          The `identifier` path parameter, echoed back
                          verbatim (URL-decoded, not otherwise validated).
        '500':
          description: The knowledge graph query failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                queryFailed:
                  value:
                    {
                      type: 'about:blank',
                      status: 500,
                      title: 'Vendor request failed',
                      detail: 'SPARQL endpoint timed out',
                      instance: '/v1/vendors/dmn/SVB_LeeftijdsInformatie',
                    }
components:
  headers:
    ApiVersion:
      description: Full release version of the API (/core/version-header).
      required: true
      schema:
        type: string
        examples:
          - '2026.09.4'
  schemas:
    Problem:
      type: object
      description: >-
        RFC 9457 problem details (https://www.rfc-editor.org/rfc/rfc9457),
        returned as `application/problem+json` by every 4xx/5xx response
        except two: `POST /dmns/evaluate/{decisionKey}` forwards Operaton's
        own error body, and `GET /health`'s 503 is the health document
        itself -- both documented at their own operation. `code` is kept as
        an extension member alongside the RFC's own fields: the
        machine-readable identifier existing callers already branch on.
        https://github.com/sgort/linked-data-explorer/issues/131.
      required: [status, title, detail]
      properties:
        type:
          type: string
          format: uri-reference
          description: >-
            A URI identifying the problem type. `about:blank` (RFC 9457
            §4.2.1) unless an operation's description says otherwise --
            every problem is that operation's own generic 4xx/5xx, not a
            documented category with its own reference page.
          examples: [about:blank]
        status:
          type: integer
          description: The HTTP status, repeated from the response line.
        title:
          type: string
          description: >-
            A short, human-readable summary of the kind of problem. Stable
            for that kind: the same title recurs across requests and, where
            there is a `code`, across every response that sets that code.
          examples: [List failed]
        detail:
          type: string
          description: What went wrong with this request.
        instance:
          type: string
          description: The request path that produced this response.
          examples: [/v1/assets/bpmn]
        code:
          type: string
          description: >-
            The machine-readable identifier this operation's description
            names, kept for callers that already branch on it. Omitted by
            the few operations that never set one.
          examples: [LIST_FAILED]
    Health:
      type: object
      required:
        [name, version, environment, build, status, uptime, timestamp, services, shacl, documentation]
      properties:
        name:
          type: string
        version:
          type: string
          description: Release version; the same value as the API-Version header.
        environment:
          type: string
        build:
          $ref: '#/components/schemas/BuildInfo'
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        uptime:
          type: number
          description: Process uptime in seconds.
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          required: [triplydb, operaton]
          properties:
            triplydb:
              $ref: '#/components/schemas/DependencyStatus'
            operaton:
              $ref: '#/components/schemas/DependencyStatus'
        shacl:
          $ref: '#/components/schemas/ShaclLayerStatus'
        documentation:
          type: string
          examples: [/v1/openapi.json]
        error:
          type: string
          description: Present only when status is unhealthy.
    BuildInfo:
      type: object
      description: >-
        The build this instance runs, recorded in the deploy artifact (#122).
        isTracked is true only when both sha and run are present; otherwise the
        label is "local build".
      required: [sha, shortSha, run, isTracked, label]
      properties:
        sha:
          type: string
          description: Full commit SHA, or empty when untracked.
        shortSha:
          type: string
        run:
          type: string
          description: GitHub Actions run number, or empty when untracked.
        isTracked:
          type: boolean
        label:
          type: string
          examples: ['build 5530720 · #135', local build]
    DependencyStatus:
      type: object
      required: [status, latency, lastCheck]
      properties:
        status:
          type: string
          enum: [up, down, unknown]
        latency:
          type: number
          description: Round trip in milliseconds; 0 when not measured.
        lastCheck:
          type: string
          format: date-time
    ShaclLayerStatus:
      type: object
      description: >-
        Which SHACL shape layers loaded. Reported only; never changes the health
        status. `layers` is present when the status was read, `error` when
        reading it failed, and neither when the health check itself failed
        before reaching it (status unhealthy).
      required: [complete]
      properties:
        complete:
          type: boolean
        layers:
          type: object
          additionalProperties:
            type: object
            required: [label, loaded]
            properties:
              label:
                type: string
              loaded:
                type: boolean
        error:
          type: string
    PublicRopaRecord:
      type: object
      description: >-
        A record of processing activities as published. Closed: internal fields
        such as the controller and DPO contacts are never included.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - processLevel
        - title
        - controllerName
        - purpose
        - legalBasisUri
        - legalBasisLabel
        - gdprArticle
        - dataSubjects
        - recipients
        - thirdCountryTransfers
        - retentionPeriod
        - securityMeasures
        - status
        - personalDataFields
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        bpmnProcessId:
          type: string
        processLevel:
          type: string
          enum: [shell, subprocess]
        title:
          type: string
        controllerName:
          type: string
        purpose:
          type: string
        legalBasisUri:
          type: string
        legalBasisLabel:
          type: string
        gdprArticle:
          type: string
        dataSubjects:
          type: string
        recipients:
          type: string
        thirdCountryTransfers:
          type: boolean
        thirdCountryDetails:
          type: string
          description: Omitted when there are no third-country transfer details.
        retentionPeriod:
          type: string
        securityMeasures:
          type: string
        status:
          type: string
          const: active
        personalDataFields:
          type: array
          items:
            $ref: '#/components/schemas/RopaPersonalDataField'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RopaPersonalDataField:
      type: object
      additionalProperties: false
      required:
        [id, ropaRecordId, formId, fieldKey, fieldLabel, dataCategory, specialCategory, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        ropaRecordId:
          type: string
          format: uuid
        formId:
          type: string
        fieldKey:
          type: string
        fieldLabel:
          type: string
        dataCategory:
          type: string
        specialCategory:
          type: boolean
        sortOrder:
          type: integer
    PublicBundle:
      type: object
      description: A deployed shell or standalone process with its deployed artefacts.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - name
        - processRole
        - linkedDmnTemplates
        - status
        - deployedAt
        - deployedForms
        - deployedDocuments
        - subprocesses
        - updatedAt
      properties:
        id:
          type: string
        bpmnProcessId:
          type: string
        name:
          type: string
        description:
          type: string
        processRole:
          type: string
          enum: [shell, standalone]
        linkedDmnTemplates:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [example, wip, e2e]
        deployedAt:
          type: string
          format: date-time
        operatonUrl:
          type: string
        operatonDeploymentId:
          type: string
        deployedForms:
          type: array
          items:
            $ref: '#/components/schemas/NamedArtefact'
        deployedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/NamedArtefact'
        subprocesses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, bpmnProcessId, status]
            properties:
              id:
                type: string
              name:
                type: string
              bpmnProcessId:
                type: string
              status:
                type: string
                enum: [example, wip, e2e]
        language:
          type: string
          maxLength: 2
        organization:
          type: string
        boardOwner:
          type: string
        updatedAt:
          type: string
          format: date-time
    NamedArtefact:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Bpmn:
      type: object
      description: >-
        A stored BPMN process definition, as returned by
        `GET /assets/bpmn`. `GET /assets/bpmn/by-bpmn-id/{bpmnProcessId}`
        returns a narrower shape instead — see BpmnLookupResult.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - name
        - xml
        - processRole
        - linkedDmnTemplates
        - status
        - readonly
        - schemaVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The storage id (`lde_id`).
        bpmnProcessId:
          type: string
        name:
          type: string
        description:
          type: string
          description: Omitted when the stored value is null.
        xml:
          type: string
          description: The BPMN 2.0 XML. Not parsed or validated server-side.
        processRole:
          type: string
          enum: [shell, subprocess, standalone]
          description: Enforced by a database CHECK constraint.
        calledElement:
          type: string
          description: Omitted when the stored value is null.
        shellId:
          type: string
          description: Omitted when the stored value is null.
        linkedDmnTemplates:
          type: array
          items:
            type: string
          description: Always present; an empty array when nothing is linked.
        status:
          type: string
          enum: [example, wip, e2e]
          description: Enforced by a database CHECK constraint.
        readonly:
          type: boolean
        schemaVersion:
          type: integer
        language:
          type: string
          maxLength: 2
          description: Omitted when the stored value is null. Not a validated ISO-639-1 code.
        organization:
          type: string
          description: Omitted when the stored value is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BpmnLookupResult:
      type: object
      description: >-
        The narrow shape `GET /assets/bpmn/by-bpmn-id/{bpmnProcessId}`
        returns — not the full Bpmn record the list operation returns.
      additionalProperties: false
      required: [id, bpmnProcessId, xml]
      properties:
        id:
          type: string
          description: The storage id (`lde_id`).
        bpmnProcessId:
          type: string
        xml:
          type: string
    Form:
      type: object
      description: >-
        A stored form schema, as returned by `GET /assets/forms`. Unlike
        `Document.schemaVersion`, a form's schema version is never returned
        on the wire, even though one is stored.
      additionalProperties: false
      required: [id, name, schema, status, createdAt, updatedAt, readonly]
      properties:
        id:
          type: string
          description: The storage id, a free-form TEXT primary key — not a UUID.
        name:
          type: string
        description:
          type: string
          description: Omitted when the stored value is null.
        schema:
          type: object
          description: >-
            Free-form JSON Schema-like form definition. A JSONB column —
            the driver returns it already parsed, not a JSON-encoded
            string. Not validated against any shape server-side.
        status:
          type: string
          description: >-
            No database CHECK constraint on this column and no fixed set
            of values in code — whatever was last written. Defaults to
            `wip` when a POST omits it.
        language:
          type: string
          maxLength: 2
          description: Omitted when the stored value is null. Not a validated ISO-639-1 code.
        organization:
          type: string
          description: Omitted when the stored value is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readonly:
          const: false
          description: Hardcoded by the mapper; never read from the database.
    Document:
      type: object
      description: A stored document template, as returned by `GET /assets/documents`.
      additionalProperties: false
      required:
        - id
        - name
        - schemaVersion
        - zones
        - bindings
        - assets
        - status
        - createdAt
        - updatedAt
        - readonly
      properties:
        id:
          type: string
          description: The storage id, a free-form TEXT primary key — not a UUID.
        name:
          type: string
        description:
          type: string
          description: Omitted when the stored value is null.
        processKey:
          type: string
          description: Omitted when the stored value is null.
        serviceId:
          type: string
          description: Omitted when the stored value is null.
        schemaVersion:
          type: integer
        zones:
          type: object
          description: >-
            Free-form JSON. A JSONB column — the driver returns it already
            parsed, not a JSON-encoded string.
        bindings:
          description: >-
            Free-form JSON, arrays by convention but not enforced. Same
            JSONB/parsing note as `zones`.
        assets:
          description: >-
            Free-form JSON, arrays by convention but not enforced. Same
            JSONB/parsing note as `zones`.
        status:
          type: string
          description: >-
            No database CHECK constraint on this column and no fixed set
            of values in code — whatever was last written. Defaults to
            `wip` when a POST omits it.
        language:
          type: string
          maxLength: 2
          description: Omitted when the stored value is null. Not a validated ISO-639-1 code.
        organization:
          type: string
          description: Omitted when the stored value is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readonly:
          const: false
          description: Hardcoded by the mapper; never read from the database.
    RopaRecord:
      type: object
      description: >-
        A stored RoPA record, as returned by `GET /assets/ropa` and
        `GET /assets/ropa/by-bpmn-id/{bpmnProcessId}`. A superset of
        PublicRopaRecord: adds the required controllerContact and
        schemaVersion and the optional dpoContact, none of which the public
        read exposes, and status is the open three-value set rather than
        the public read's `const: active` (a query filter on the public
        read, not a difference in what the database can hold).
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - processLevel
        - title
        - controllerName
        - controllerContact
        - purpose
        - legalBasisUri
        - legalBasisLabel
        - gdprArticle
        - dataSubjects
        - recipients
        - thirdCountryTransfers
        - retentionPeriod
        - securityMeasures
        - status
        - schemaVersion
        - personalDataFields
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        bpmnProcessId:
          type: string
        processLevel:
          type: string
          enum: [shell, subprocess]
        title:
          type: string
        controllerName:
          type: string
        controllerContact:
          type: string
        dpoContact:
          type: string
          description: Omitted when the stored value is null.
        purpose:
          type: string
        legalBasisUri:
          type: string
        legalBasisLabel:
          type: string
        gdprArticle:
          type: string
        dataSubjects:
          type: string
        recipients:
          type: string
        thirdCountryTransfers:
          type: boolean
        thirdCountryDetails:
          type: string
          description: Omitted when there are no third-country transfer details.
        retentionPeriod:
          type: string
        securityMeasures:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        schemaVersion:
          type: integer
        personalDataFields:
          type: array
          items:
            $ref: '#/components/schemas/RopaPersonalDataField'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CacheStats:
      type: object
      description: >-
        SPARQL result cache entries keyed by endpoint URL. `age` is the number of
        seconds since the entry was cached; `count` is the number of cached DMN
        records.
      additionalProperties:
        type: object
        required: [age, count]
        properties:
          age:
            type: integer
            minimum: 0
          count:
            type: integer
            minimum: 0
    NormsResult:
      type: object
      required: [total, dataset_versions, cprmv_version, aggregations, rules]
      properties:
        total:
          type: integer
          minimum: 0
          description: Number of rules in `rules`.
        dataset_versions:
          type: object
          description: Published dataset versions per ruleset id, newest first.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DatasetVersion'
        cprmv_version:
          type: string
          description: The CPRMV version the rule keys use.
          examples: ['0.3.0']
        aggregations:
          type: object
          required: [norms_per_rulesetid]
          properties:
            norms_per_rulesetid:
              type: object
              description: Number of rules per ruleset id.
              additionalProperties:
                type: integer
                minimum: 0
        rules:
          type: array
          description: >-
            Published rules. A rule's keys are IRIs in the requested CPRMV
            version's namespace (for example
            `https://cprmv.open-regels.nl/0.3.0/id`), plus `rulesetid`,
            `applicable_date`, `rulesetid_index`, `rule_id_path` and
            `rule_id_path_key`. A nested `contains` map, keyed by rule id, is
            present when the rule has children. The key set varies by version,
            so rules are described as open objects.
          items:
            type: object
    DatasetVersion:
      type: object
      required: [version, published_at, title]
      properties:
        version:
          type: [string, 'null']
          description: Null for rulesets other than the primary one.
        published_at:
          type: string
          description: Publication date as published in TriplyDB, normally ISO 8601; not reformatted.
        title:
          type: [string, 'null']
          description: Null for rulesets other than the primary one.
    TriplyDbConfig:
      type: object
      description: TriplyDB connection settings supplied by the caller (#142).
      required: [baseUrl, account, dataset, apiToken]
      properties:
        baseUrl:
          type: string
          examples: ['https://api.open-regels.triply.cc']
        account:
          type: string
        dataset:
          type: string
        apiToken:
          type: string
    SparqlResults:
      type: object
      description: >-
        SPARQL 1.1 Query Results JSON as returned by the endpoint, unchanged:
        `head` and `results.bindings` for SELECT, `head` and `boolean` for ASK.
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SparqlBinding'
        boolean:
          type: boolean
    SparqlBinding:
      type: object
      required: [value]
      properties:
        type:
          type: string
          examples: [uri]
        value:
          type: string
        datatype:
          type: string
        'xml:lang':
          type: string
    TriplyDbAsset:
      type: object
      required: [id, name, url, size, contentType]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          description: Download URL of the first version, or a constructed page URL when the asset has no versions.
        size:
          type: number
          minimum: 0
          description: Size of the first version in bytes, or 0 when there is none.
        contentType:
          type: string
          description: Always `image/png`; TriplyDB does not report the type.
    DmnModel:
      type: object
      required: [id, identifier, title, inputs, outputs, vendorCount, xmlUrl]
      properties:
        id:
          type: string
          description: IRI of the DMN.
        identifier:
          type: string
        title:
          type: string
        description:
          type: string
        deploymentId:
          type: string
        deployedAt:
          type: string
          description: As published in the knowledge graph; not reformatted.
        implementedBy:
          type: string
        lastTested:
          type: string
        testStatus:
          type: string
          description: Usually `passed`, `failed` or `pending`; read from the knowledge graph and not enforced.
        service:
          type: string
        serviceTitle:
          type: string
        organization:
          type: string
        organizationName:
          type: string
        logoUrl:
          type: string
        xmlUrl:
          type: string
          description: Relative link to the DMN XML download.
          examples: [/v1/dmns/SVB_LeeftijdsInformatie/xml]
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/DmnVariable'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/DmnVariable'
        validationStatus:
          type: string
          description: Usually `validated`, `in-review` or `not-validated`; read from the knowledge graph and not enforced.
        validatedBy:
          type: string
        validatedByName:
          type: string
        validatedAt:
          type: string
          description: As published in the knowledge graph; not reformatted.
        validationNote:
          type: string
        vendorCount:
          type: integer
          minimum: 0
    DmnVariable:
      type: object
      required: [identifier, title, type]
      properties:
        identifier:
          type: string
        title:
          type: string
        type:
          type: string
          description: Usually `String`, `Integer`, `Boolean`, `Date` or `Double`; read from the knowledge graph and not enforced.
        description:
          type: string
        testValue:
          type: [string, number, boolean, 'null']
          description: >-
            Example value, converted according to `type`. A non-numeric value for
            an Integer or Double variable serialises as null.
    SemanticEquivalence:
      type: object
      required: [sharedConcept, concept1, concept2, dmn1, dmn2]
      properties:
        sharedConcept:
          type: string
          description: IRI of the concept both variables refer to.
        concept1:
          $ref: '#/components/schemas/SemanticConcept'
        concept2:
          $ref: '#/components/schemas/SemanticConcept'
        dmn1:
          $ref: '#/components/schemas/DmnReference'
        dmn2:
          $ref: '#/components/schemas/DmnReference'
    SemanticConcept:
      type: object
      required: [uri, label, variable]
      properties:
        uri:
          type: string
        label:
          type: string
        notation:
          type: string
        variable:
          type: object
          required: [uri, identifier, type]
          properties:
            uri:
              type: string
            identifier:
              type: string
            type:
              type: string
              description: Read from the knowledge graph; not enforced.
    DmnReference:
      type: object
      required: [uri, title]
      properties:
        uri:
          type: string
        identifier:
          type: string
        title:
          type: string
    EnhancedChainLink:
      type: object
      required: [dmn1, dmn2, outputVariable, inputVariable, variableType, matchType, sharedConcept]
      properties:
        dmn1:
          $ref: '#/components/schemas/DmnReference'
        dmn2:
          $ref: '#/components/schemas/DmnReference'
        outputVariable:
          type: string
        inputVariable:
          type: string
        variableType:
          type: string
        matchType:
          type: string
          enum: [exact, semantic]
          description: A link that matches both ways is listed twice, once per match type.
        sharedConcept:
          type: string
    ChainCycle:
      type: object
      required: [path, type]
      properties:
        path:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/DmnReference'
        type:
          type: string
          enum: [three-hop, four-hop]
          description: Only `three-hop` cycles are detected today.
    OperatonDecisionResult:
      type: object
      description: One result row, mapping each output name to its typed value.
      additionalProperties:
        type: object
        required: [value, type]
        properties:
          value: {}
          type:
            type: string
            examples: [Boolean]
    OperatonProxyError:
      type: object
      description: Returned when Operaton could not be reached at all.
      required: [type, message]
      properties:
        type:
          const: ProxyError
        message:
          type: string
    DmnValidationResult:
      type: object
      required: [valid, parseError, layers, summary]
      properties:
        valid:
          type: boolean
          description: True when the XML parsed and no layer reported an error.
        parseError:
          type: [string, 'null']
        layers:
          type: object
          required: [base, business, execution, interaction, content]
          properties:
            base:
              $ref: '#/components/schemas/ValidationLayer'
            business:
              $ref: '#/components/schemas/ValidationLayer'
            execution:
              $ref: '#/components/schemas/ValidationLayer'
            interaction:
              $ref: '#/components/schemas/ValidationLayer'
            content:
              $ref: '#/components/schemas/ValidationLayer'
        summary:
          type: object
          required: [errors, warnings, infos]
          properties:
            errors:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
            infos:
              type: integer
              minimum: 0
    ValidationLayer:
      type: object
      required: [label, issues]
      properties:
        label:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
          examples: [BIZ-006]
        message:
          type: string
        location:
          type: string
        line:
          type: integer
        column:
          type: integer
    ShaclValidationResult:
      type: object
      description: >-
        `layers` is a closed set of exactly three shape layers — not a map,
        unlike the similarly-named ShaclLayerStatus block in /health.
      required: [valid, complete, parseError, layers, summary]
      properties:
        valid:
          type: boolean
          description: >-
            True only when the content parsed, every layer loaded, and no
            layer reported an error.
        complete:
          type: boolean
          description: True when every shape layer loaded. False on a parse error.
        parseError:
          type: [string, 'null']
        layers:
          type: object
          required: [cprmv, cpsv-ap, ronl-custom]
          properties:
            cprmv:
              $ref: '#/components/schemas/ShaclLayerResult'
            cpsv-ap:
              $ref: '#/components/schemas/ShaclLayerResult'
            ronl-custom:
              $ref: '#/components/schemas/ShaclLayerResult'
        summary:
          type: object
          required: [errors, warnings, infos]
          properties:
            errors:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
            infos:
              type: integer
              minimum: 0
    ShaclLayerResult:
      type: object
      required: [label, loaded, issues]
      properties:
        label:
          type: string
        loaded:
          type: boolean
          description: False when no shape files were present for this layer.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ShaclIssue'
    ShaclIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
          description: Derived at runtime from the SHACL constraint component IRI.
          examples: [SHACL-MAXCOUNT]
        message:
          type: string
        location:
          type: string
          description: Present only when the violation has a focus node or a path.
    ChainTemplate:
      type: object
      description: >-
        A predefined chain template, defined in code (TemplateService), not
        sourced from the knowledge graph. Serves both `GET /chains/templates`
        and `GET /chains/templates/{id}`.
      required:
        - id
        - name
        - description
        - type
        - category
        - dmnIds
        - tags
        - complexity
        - estimatedTime
        - createdAt
        - updatedAt
        - isPublic
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [sequential, drd]
          description: >-
            Fixed at the template's definition site; `drd` is reachable but
            unused by today's three predefined templates (all `sequential`).
        category:
          type: string
          enum: [social, financial, legal, custom]
          description: >-
            Fixed at the template's definition site; `legal` and `custom` are
            reachable but unused by today's three predefined templates.
        dmnIds:
          type: array
          items:
            type: string
        drdId:
          type: string
          description: >-
            Entry-point identifier for a `drd`-type template. Never set on
            today's templates (all `sequential`).
        drdDeploymentId:
          type: string
          description: >-
            Operaton deployment id for a `drd`-type template. Never set on
            today's templates (all `sequential`).
        defaultInputs:
          type: object
          description: >-
            Free-form: arbitrary keys, arbitrary JSON values. Today's
            templates spread saved test inputs from testData.json, plus a
            computed `dagVanAanvraag` date.
        tags:
          type: array
          items:
            type: string
        complexity:
          type: string
          enum: [simple, medium, complex]
          description: Fixed at the template's definition site.
        estimatedTime:
          type: number
          minimum: 0
          description: Milliseconds.
        usageCount:
          type: integer
          minimum: 0
          description: >-
            Hardcoded per template today. A successful `GET
            /chains/templates/{id}` awaits an increment that is a documented
            no-op, so this value never actually changes.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: >-
            Computed once, at process start (module load), not per request —
            effectively constant for the process's lifetime.
        author:
          type: string
        isPublic:
          type: boolean
    ChainMapEntry:
      type: object
      description: >-
        One source DMN and every downstream DMN it can feed, built by
        grouping the pairwise SPARQL chain links by their `from` DMN
        (chain.routes.ts, the handler's own local `ChainMapEntry`
        interface). Distinct from the DMN-record schemas of phase 2
        (DmnModel, DmnReference, EnhancedChainLink, ChainCycle).
      required: [from, connections]
      properties:
        from:
          type: string
          description: Source DMN identifier, from a SPARQL binding.
        connections:
          type: array
          items:
            type: object
            required: [to, variable, variableType]
            properties:
              to:
                type: string
                description: Downstream DMN identifier, from a SPARQL binding.
              variable:
                type: string
                description: The variable identifier that connects the two DMNs.
              variableType:
                type: string
                description: >-
                  The variable's declared type, from a SPARQL binding — a
                  plain string, never an enum.
    ExecutionStep:
      type: object
      description: >-
        One DMN evaluated within a chain execution. orchestration.service.ts
        only pushes a step onto `steps` after it has completed successfully;
        a step whose evaluation throws sets its own `error` field but is then
        discarded, re-thrown to the caller before that push runs, so it is
        never added to `steps`. Every step this API actually returns
        therefore always carries `outputs`, and `error` never appears here —
        unlike the `ExecutionStep` TypeScript type, which marks `outputs` and
        `error` as mutually-exclusive optionals.
      required: [dmnId, dmnTitle, startTime, endTime, duration, inputs, outputs]
      properties:
        dmnId:
          type: string
        dmnTitle:
          type: string
        startTime:
          type: number
          description: Epoch milliseconds.
        endTime:
          type: number
          description: Epoch milliseconds.
        duration:
          type: number
          description: Milliseconds; `endTime` minus `startTime`.
        inputs:
          type: object
          description: >-
            Free-form snapshot of the accumulated chain variables immediately
            before this step ran.
        outputs:
          type: object
          description: >-
            Free-form: this step's outputs, already unwrapped from Operaton's
            `{value, type}` form.
    VendorService:
      type: object
      description: >-
        A vendor's implementation of a reference DMN, read from the
        knowledge graph. Every property beyond `id`, `basedOn` and
        `provider` is published data with nothing in code constraining its
        shape or values — plain strings, never enums.
      required: [id, basedOn, provider]
      properties:
        id:
          type: string
          description: IRI of the vendor service.
        basedOn:
          type: string
          description: IRI of the reference DMN this service implements.
        basedOnIdentifier:
          type: string
          description: The reference DMN's short identifier, when the graph publishes one.
          examples: ['SVB_LeeftijdsInformatie']
        implementedBy:
          type: string
          description: IRI of the implementation platform, when the graph publishes one.
        implementedByName:
          type: string
          description: The implementation platform's name, preferring Dutch when both are published.
          examples: ['Blueriq']
        provider:
          $ref: '#/components/schemas/VendorOrganization'
        serviceUrl:
          type: string
          description: URL to access the vendor service, when the graph publishes one.
        license:
          type: string
          examples: ['Commercial', 'Open Source']
        accessType:
          type: string
          examples: ['iam-required', 'public', 'api-key']
        description:
          type: string
    VendorOrganization:
      type: object
      description: The vendor providing a VendorService.
      required: [name, contactPoint]
      properties:
        name:
          type: string
          description: Defaults to `'Unknown Vendor'` when the graph publishes no name.
        logoUrl:
          type: string
          description: >-
            Resolved from the graph's stored logo path to a downloadable
            URL. Absent whenever that resolution fails, for any reason —
            resolution failures never turn the request into an error.
        homepage:
          type: string
        contactPoint:
          $ref: '#/components/schemas/VendorContact'
    VendorContact:
      type: object
      description: >-
        Always present as an object on `provider`, even when the graph
        publishes none of its own properties — in that case every property
        below is simply absent, not the object itself.
      properties:
        name:
          type: string
        email:
          type: string
        telephone:
          type: string
