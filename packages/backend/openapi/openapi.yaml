  /dmns/drd/deploy:
    post:
      operationId: deployDrd
      tags: [Discovery]
      summary: Assemble deployed DMNs into one DRD and deploy it to Operaton
      description: >-
        The last id in `dmnIds` is the entry point and names the deployed file.
        Operaton's own error status is not passed through; failures answer 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dmnIds, deploymentName]
              properties:
                dmnIds:
                  type: array
                  minItems: 2
                  items:
                    type: string
                deploymentName:
                  type: string
      responses:
        '200':
          description: The DRD was deployed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [deploymentId, entryPointId, filename, dmnCount]
                    properties:
                      deploymentId:
                        type: string
                      entryPointId:
                        type: string
                      filename:
                        type: string
                      dmnCount:
                        type: integer
                        minimum: 2
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`dmnIds` has fewer than two entries or `deploymentName` is blank (code INVALID_INPUT).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            Assembly or deployment failed (code DRD_DEPLOY_FAILED), or the request
            body was not valid JSON (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dmns/process/deploy:
    post:
      operationId: deployProcess
      tags: [Discovery]
      summary: Deploy a BPMN process bundle to Operaton
      description: >-
        Deploys the BPMN with its subprocesses, forms and document templates as
        one Operaton deployment, tagged with `organization` as the tenant. When
        `operatonUrl` is given, that Operaton instance is used instead (not
        validated, #142). Operaton's own error status is not passed through.


        After the Operaton deploy succeeds, the backend also records the
        bundle in its own storage — finding the stored process by the BPMN's
        own process id, or creating a minimal one when none exists yet — so
        the dashboard and public site can list it without a second,
        browser-initiated write. That storage step can never fail this
        response: `bundleRecorded` says whether it worked, and
        `bundleRecordingError` says why when it didn't (#155).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpmnXml, deploymentName, organization]
              properties:
                bpmnXml:
                  type: string
                deploymentName:
                  type: string
                organization:
                  type: string
                  description: Becomes the Operaton tenant id.
                forms:
                  type: array
                  items:
                    type: object
                    required: [id, schema]
                    properties:
                      id:
                        type: string
                      schema:
                        type: object
                subProcesses:
                  type: array
                  items:
                    type: object
                    required: [filename, xml]
                    properties:
                      filename:
                        type: string
                      xml:
                        type: string
                documents:
                  type: array
                  items:
                    type: object
                    required: [id, template]
                    properties:
                      id:
                        type: string
                      template:
                        type: object
                operatonUrl:
                  type: string
                operatonUsername:
                  type: string
                operatonPassword:
                  type: string
                boardOwner:
                  type: string
                  description: Omit to derive it from the BPMN candidate groups; an empty string leaves it unset.
      responses:
        '200':
          description: The bundle was deployed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [deploymentId, resourceCount, bundleRecorded]
                    properties:
                      deploymentId:
                        type: string
                      resourceCount:
                        type: integer
                        minimum: 1
                      bundleRecorded:
                        type: boolean
                        description: >-
                          Whether the deployed bundle was also recorded in
                          storage. Always true or false; the Operaton deploy
                          above already happened either way, so a storage
                          failure here never turns this response into an
                          error.
                      bundleRecordingError:
                        type: string
                        description: Present only when `bundleRecorded` is false.
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`bpmnXml`, `deploymentName` or `organization` is missing or blank (code INVALID_INPUT).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            Deployment failed (code PROCESS_DEPLOY_FAILED; the message carries
            Operaton's error text), or the request body was not valid JSON (code
            INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dmns/deploy:
    post:
      operationId: deployDmn
      tags: [Discovery]
      summary: Deploy DMN XML to Operaton as it is
      description: Operaton's own error status is not passed through; failures answer 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xml, deploymentName]
              properties:
                xml:
                  type: string
                deploymentName:
                  type: string
                filename:
                  type: string
                  description: Defaults to `<deploymentName>.dmn` when missing or blank.
      responses:
        '200':
          description: The DMN was deployed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [deploymentId]
                    properties:
                      deploymentId:
                        type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`xml` or `deploymentName` is missing or blank (code INVALID_INPUT).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            Deployment failed (code DMN_DEPLOY_FAILED), or the request body was not
            valid JSON (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /dmns/evaluate/{decisionKey}:
    post:
      operationId: evaluateDecision
      tags: [Discovery]
      summary: Evaluate a deployed decision in Operaton
      description: >-
        A proxy for Operaton's decision evaluation, kept byte-for-byte compatible
        with calling Operaton directly: the result has no `success`/`data`
        envelope, and Operaton's own error status and body are passed through.
        Nothing is validated here; Operaton rejects invalid input itself, answering
        400.
      parameters:
        - name: decisionKey
          in: path
          required: true
          description: The Operaton decision definition key.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  description: Input variables in Operaton's format. A missing object is sent as empty.
                  additionalProperties:
                    type: object
                    required: [value]
                    properties:
                      value: {}
                      type:
                        type: string
                        examples: [Integer]
                      valueInfo:
                        type: object
      responses:
        '200':
          description: Operaton's decision result, one output map per result row.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OperatonDecisionResult'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OperatonDecisionResult'
        '400':
          description: >-
            Operaton rejected the input (for example a variable of the wrong
            type), and its error body is passed through unchanged.
          content:
            application/json:
              schema:
                description: Operaton's error body, unchanged.
        '500':
          description: >-
            Operaton's own error body passed through (for example a
            `RestException`), or a `ProxyError` when Operaton could not be
            reached (`application/json`, this operation's own proxy
            behaviour -- kept as-is, see the `Problem` schema's
            description). Problem details (`application/problem+json`) when
            the request body itself was not valid JSON (#143): that never
            reaches this route's own handler, so it is the global error
            handler's shape, not the proxy's.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OperatonProxyError'
                  - description: Operaton's error body, unchanged.
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Operaton's own error status and body, passed through unchanged.
          content:
            application/json:
              schema: {}
  /dmns/validate:
    post:
      operationId: validateDmn
      tags: [Discovery]
      summary: Validate DMN XML in five layers
      description: >-
        Runs locally, without Operaton or TriplyDB. The HTTP status says whether
        the request could be processed; the verdict on the DMN is in `data.valid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The DMN XML.
      responses:
        '200':
          description: The validation result, valid or not.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/DmnValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`content` is missing, empty or not a string (code INVALID_REQUEST).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The validator failed unexpectedly (code VALIDATION_ERROR), or the
            request body was not valid JSON or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /shacl/validate:
    post:
      operationId: validateShacl
      tags: [Validation]
      summary: Validate Turtle against the vendored SHACL shape set
      description: >-
        Runs entirely file-local, against the vendored CPSV-AP, CPRMV and RONL
        Custom shape layers; no network calls. A Turtle parse failure is
        reported as a 200 with `data.parseError` set and `data.valid: false`,
        not a 400 or 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The Turtle to validate.
      responses:
        '200':
          description: The validation result, valid or not.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ShaclValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`content` is missing, empty or not a string (code INVALID_REQUEST).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The validator failed unexpectedly (code VALIDATION_ERROR), or the
            request body was not valid JSON or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /shacl/validate-merged:
    post:
      operationId: validateShaclMerged
      tags: [Validation]
      summary: Validate Turtle unioned with the already-published graph for its subjects
      description: >-
        Fetches the triples already published for the uploaded content's named
        subjects from a SPARQL endpoint, unions them with the upload, and
        validates the merged graph — the only mode that catches fan-out
        against live data. If the upload has no named subjects (only blank
        nodes), the merge is skipped and the file is validated locally
        instead, exactly as `/shacl/validate`. A parse failure of the
        uploaded content is likewise a 200 with `data.parseError` set; a
        failure fetching or parsing the remote graph is a 500, since that is
        not the caller's fault.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The Turtle to validate.
                endpoint:
                  type: string
                  description: >-
                    SPARQL endpoint to fetch the already-published graph from.
                    Defaults to the configured TriplyDB endpoint when omitted.
      responses:
        '200':
          description: The validation result, valid or not.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ShaclValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`content` is missing, empty or not a string (code INVALID_REQUEST).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            The validator failed unexpectedly (code VALIDATION_ERROR) — no
            endpoint configured, or the remote graph could not be
            fetched/parsed — or the request body was not valid JSON or over
            10 MB (code INTERNAL_ERROR; #143).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /process/{key}/variable-hints:
    get:
      operationId: getProcessVariableHints
      tags: [Execution]
      summary: Deduplicated variable names and types seen in Operaton history for a process definition key
      description: >-
        Used by the Document Composer's BindingPanel for variable discovery.
        `key` is passed to Operaton unchecked: any non-empty value either
        succeeds (possibly with an empty `variables` array) or fails with a
        500 — there is no 400. Deduplicated by variable name, keeping the
        last-seen type; sorted by name.
      parameters:
        - name: key
          in: path
          required: true
          description: Process definition key, passed to Operaton unchecked.
          schema:
            type: string
      responses:
        '200':
          description: The deduplicated variables, sorted by name. Empty when none were seen.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, variables]
                properties:
                  success:
                    const: true
                  variables:
                    type: array
                    items:
                      type: object
                      required: [name, type]
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          description: >-
                            Operaton's own variable type (e.g. String, Integer,
                            Boolean, Double, Date, Json, Object, Null); not
                            validated or restricted by this API.
        '500':
          description: >-
            Fetching from Operaton failed (code VARIABLE_HINTS_FAILED).
            Unlike other operations' 500s, `detail` is a fixed string, not
            the underlying error.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      detail:
                        const: Failed to retrieve variable hints
                      code:
                        const: VARIABLE_HINTS_FAILED
  /chains:
    get:
      operationId: discoverChains
      tags: [Execution]
      summary: Pairwise DMN chain links, grouped by source DMN
      description: >-
        Discovers, via SPARQL, every DMN whose declared output variable
        matches another DMN's declared input variable, then groups those
        pairwise links by the source (`from`) DMN. Takes no parameters —
        `req.query` is never read — so there is nothing for the handler to
        reject with a 400. `chains` is `[]`, still with a 200, when no links
        are found.
      responses:
        '200':
          description: The chain links, grouped by source DMN. Empty when none exist.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [total, chains]
                    properties:
                      total:
                        type: integer
                        minimum: 0
                        description: '`chains.length`.'
                      chains:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChainMapEntry'
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The SPARQL lookup failed (code DISCOVERY_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /chains/execute:
    post:
      operationId: executeChain
      tags: [Execution]
      summary: Execute a chain of DMNs sequentially, or a pre-assembled DRD in one call
      description: >-
        Threads each DMN's outputs into the next DMN's inputs, evaluating each
        one in Operaton in turn (`orchestrationService.executeChain`). When
        `isDrd` and `drdEntryPointId` are both given, that sequential
        execution is skipped entirely and all `inputs` are sent to Operaton's
        evaluation of the pre-assembled DRD in a single call instead. A step
        is only ever added to `steps` once it has completed successfully —
        `orchestration.service.ts` pushes it after its try/catch, and a step
        whose evaluation throws re-throws before that push is reached, so it
        is never added; the problem's `detail` carries that failure instead.
        Every populated `steps` entry therefore always has `outputs`, never
        `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dmnIds, inputs]
              properties:
                dmnIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >-
                    DMN identifiers to execute in order (or, for the DRD path,
                    the identifiers the DRD was assembled from). Required and
                    must not be empty.
                inputs:
                  type: object
                  minProperties: 1
                  description: >-
                    Free-form initial input variables. Required and must not
                    be an empty object.
                options:
                  type: object
                  description: >-
                    Only `includeIntermediateSteps` is read; `timeout` is
                    declared in the request type but never read anywhere and
                    has no effect.
                  properties:
                    includeIntermediateSteps:
                      type: boolean
                      description: When true, the response's `data` carries `steps`.
                endpoint:
                  type: string
                  description: >-
                    SPARQL endpoint URL to query instead of the configured
                    one, used to look up the chain's DMNs. Unvalidated, and
                    ignored when `isDrd` is true, because that path does not
                    look the DMNs up.
                isDrd:
                  type: boolean
                  description: >-
                    When true together with `drdEntryPointId`, executes the
                    pre-assembled DRD instead of the sequential chain.
                drdEntryPointId:
                  type: string
                  description: >-
                    The DRD's entry-point decision key, used only when `isDrd`
                    is also true.
      responses:
        '200':
          description: The chain (or DRD) completed successfully.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [success, chainId, executionTime, finalOutputs]
                    properties:
                      success:
                        const: true
                      chainId:
                        type: string
                        description: >-
                          The executed DMN identifiers joined with `->`, or,
                          for the DRD path, `DRD:<drdEntryPointId>`.
                      executionTime:
                        type: number
                        description: Milliseconds.
                      finalOutputs:
                        type: object
                        description: >-
                          Free-form: the accumulated chain variables once
                          every step has run, already unwrapped from
                          Operaton's `{value, type}` form.
                      steps:
                        type: array
                        description: Present only when the caller set `options.includeIntermediateSteps`.
                        items:
                          $ref: '#/components/schemas/ExecutionStep'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: >-
            `dmnIds` is missing or empty (message "dmnIds array is required
            and must not be empty"), or `inputs` is missing or an empty
            object (message "inputs object is required"). Both are code
            INVALID_REQUEST.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: >-
            Three causes share this status. The orchestrator resolving with
            `success: false` (a DMN in the chain threw, or the DRD
            evaluation threw) answers a problem response whose `data`
            extension member carries the partial chain result -- which
            steps ran, the outputs so far -- so that information is not
            lost alongside the failure (`detail`). The route's own
            try/catch (code EXECUTION_ERROR) and the request body not being
            valid JSON, or over 10 MB (code INTERNAL_ERROR; #143 — the
            latter never reaches this route's own handler; it is answered
            by the global error handler) answer a problem response with no
            `data`.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - allOf:
                      - $ref: '#/components/schemas/Problem'
                      - type: object
                        description: >-
                          The orchestrator resolved with `success: false`.
                          `data` carries the same fields the 200 response's
                          `data` does, minus `success`.
                        required: [data]
                        properties:
                          data:
                            type: object
                            required: [chainId, executionTime, finalOutputs]
                            properties:
                              chainId:
                                type: string
                              executionTime:
                                type: number
                                description: Milliseconds.
                              finalOutputs:
                                type: object
                                description: >-
                                  Free-form: whatever chain variables had
                                  accumulated before the failure. `{}` for a
                                  failed DRD run.
                              steps:
                                type: array
                                description: Present only when the caller set `options.includeIntermediateSteps`. `[]` for a failed DRD run.
                                items:
                                  $ref: '#/components/schemas/ExecutionStep'
                  - $ref: '#/components/schemas/Problem'
  /chains/templates:
    get:
      operationId: listChainTemplates
      tags: [Execution]
      summary: Predefined chain templates
      description: >-
        Templates are a fixed, in-memory list (three today), not sourced from
        the knowledge graph or a database; `endpoint` is accepted but has no
        effect on the result (reserved for future database-backed templates).
        `category` filters when given as a single string value; `tag` is only
        consulted when `category` is absent or not a single string. A
        repeated query parameter, or a category/tag that matches nothing,
        never answers 400 — it is ignored or yields an empty `templates`
        array. `categories` here is derived from the templates already
        returned, so it narrows along with a `category`/`tag` filter, unlike
        `GET /chains/templates/categories/list`, which always lists every
        category.
      parameters:
        - name: category
          in: query
          required: false
          description: Exact category match. Wins over `tag` when both are given.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Exact tag match. Only consulted when `category` is absent.
          schema:
            type: string
        - name: endpoint
          in: query
          required: false
          description: >-
            SPARQL endpoint URL to query instead of the configured one.
            Accepted but has no effect on predefined templates today.
          schema:
            type: string
      responses:
        '200':
          description: The templates, optionally filtered.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [total, templates, categories]
                    properties:
                      total:
                        type: integer
                        minimum: 0
                      templates:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChainTemplate'
                      categories:
                        type: array
                        items:
                          type: string
                        description: Deduplicated and sorted, derived from `templates` above.
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The template lookup failed (code QUERY_ERROR).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
