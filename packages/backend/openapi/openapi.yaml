                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            Assembly or deployment failed (code DRD_DEPLOY_FAILED), or the request
            body was not valid JSON (code INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /dmns/process/deploy:
    post:
      operationId: deployProcess
      tags: [Discovery]
      summary: Deploy a BPMN process bundle to Operaton
      description: >-
        Deploys the BPMN with its subprocesses, forms and document templates as
        one Operaton deployment, tagged with `organization` as the tenant. When
        `operatonUrl` is given, that Operaton instance is used instead (not
        validated, #142). Operaton's own error status is not passed through.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bpmnXml, deploymentName, organization]
              properties:
                bpmnXml:
                  type: string
                deploymentName:
                  type: string
                organization:
                  type: string
                  description: Becomes the Operaton tenant id.
                forms:
                  type: array
                  items:
                    type: object
                    required: [id, schema]
                    properties:
                      id:
                        type: string
                      schema:
                        type: object
                subProcesses:
                  type: array
                  items:
                    type: object
                    required: [filename, xml]
                    properties:
                      filename:
                        type: string
                      xml:
                        type: string
                documents:
                  type: array
                  items:
                    type: object
                    required: [id, template]
                    properties:
                      id:
                        type: string
                      template:
                        type: object
                operatonUrl:
                  type: string
                operatonUsername:
                  type: string
                operatonPassword:
                  type: string
                boardOwner:
                  type: string
                  description: Omit to derive it from the BPMN candidate groups; an empty string leaves it unset.
      responses:
        '200':
          description: The bundle was deployed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [deploymentId, resourceCount]
                    properties:
                      deploymentId:
                        type: string
                      resourceCount:
                        type: integer
                        minimum: 1
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`bpmnXml`, `deploymentName` or `organization` is missing or blank (code INVALID_INPUT).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            Deployment failed (code PROCESS_DEPLOY_FAILED; the message carries
            Operaton's error text), or the request body was not valid JSON (code
            INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /dmns/deploy:
    post:
      operationId: deployDmn
      tags: [Discovery]
      summary: Deploy DMN XML to Operaton as it is
      description: Operaton's own error status is not passed through; failures answer 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xml, deploymentName]
              properties:
                xml:
                  type: string
                deploymentName:
                  type: string
                filename:
                  type: string
                  description: Defaults to `<deploymentName>.dmn` when missing or blank.
      responses:
        '200':
          description: The DMN was deployed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [deploymentId]
                    properties:
                      deploymentId:
                        type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`xml` or `deploymentName` is missing or blank (code INVALID_INPUT).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            Deployment failed (code DMN_DEPLOY_FAILED), or the request body was not
            valid JSON (code INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /dmns/evaluate/{decisionKey}:
    post:
      operationId: evaluateDecision
      tags: [Discovery]
      summary: Evaluate a deployed decision in Operaton
      description: >-
        A proxy for Operaton's decision evaluation, kept byte-for-byte compatible
        with calling Operaton directly: the result has no `success`/`data`
        envelope, and Operaton's own error status and body are passed through.
        Nothing is validated here; Operaton rejects invalid input itself, answering
        400.
      parameters:
        - name: decisionKey
          in: path
          required: true
          description: The Operaton decision definition key.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  description: Input variables in Operaton's format. A missing object is sent as empty.
                  additionalProperties:
                    type: object
                    required: [value]
                    properties:
                      value: {}
                      type:
                        type: string
                        examples: [Integer]
                      valueInfo:
                        type: object
      responses:
        '200':
          description: Operaton's decision result, one output map per result row.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OperatonDecisionResult'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OperatonDecisionResult'
        '400':
          description: >-
            Operaton rejected the input (for example a variable of the wrong
            type), and its error body is passed through unchanged.
          content:
            application/json:
              schema:
                description: Operaton's error body, unchanged.
        '500':
          description: >-
            Operaton's own error body passed through (for example a
            `RestException`), a `ProxyError` when Operaton could not be reached, or
            `ErrorEnvelope` when the request body was not valid JSON (#143).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OperatonProxyError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - description: Operaton's error body, unchanged.
        default:
          description: Operaton's own error status and body, passed through unchanged.
          content:
            application/json:
              schema: {}
  /dmns/validate:
    post:
      operationId: validateDmn
      tags: [Discovery]
      summary: Validate DMN XML in five layers
      description: >-
        Runs locally, without Operaton or TriplyDB. The HTTP status says whether
        the request could be processed; the verdict on the DMN is in `data.valid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The DMN XML.
      responses:
        '200':
          description: The validation result, valid or not.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/DmnValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`content` is missing, empty or not a string (code INVALID_REQUEST).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            The validator failed unexpectedly (code VALIDATION_ERROR), or the
            request body was not valid JSON or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /shacl/validate:
    post:
      operationId: validateShacl
      tags: [Validation]
      summary: Validate Turtle against the vendored SHACL shape set
      description: >-
        Runs entirely file-local, against the vendored CPSV-AP, CPRMV and RONL
        Custom shape layers; no network calls. A Turtle parse failure is
        reported as a 200 with `data.parseError` set and `data.valid: false`,
        not a 400 or 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The Turtle to validate.
      responses:
        '200':
          description: The validation result, valid or not.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ShaclValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`content` is missing, empty or not a string (code INVALID_REQUEST).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            The validator failed unexpectedly (code VALIDATION_ERROR), or the
            request body was not valid JSON or over 10 MB (code INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /shacl/validate-merged:
    post:
      operationId: validateShaclMerged
      tags: [Validation]
      summary: Validate Turtle unioned with the already-published graph for its subjects
      description: >-
        Fetches the triples already published for the uploaded content's named
        subjects from a SPARQL endpoint, unions them with the upload, and
        validates the merged graph — the only mode that catches fan-out
        against live data. If the upload has no named subjects (only blank
        nodes), the merge is skipped and the file is validated locally
        instead, exactly as `/shacl/validate`. A parse failure of the
        uploaded content is likewise a 200 with `data.parseError` set; a
        failure fetching or parsing the remote graph is a 500, since that is
        not the caller's fault.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The Turtle to validate.
                endpoint:
                  type: string
                  description: >-
                    SPARQL endpoint to fetch the already-published graph from.
                    Defaults to the configured TriplyDB endpoint when omitted.
      responses:
        '200':
          description: The validation result, valid or not.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ShaclValidationResult'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`content` is missing, empty or not a string (code INVALID_REQUEST).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            The validator failed unexpectedly (code VALIDATION_ERROR) — no
            endpoint configured, or the remote graph could not be
            fetched/parsed — or the request body was not valid JSON or over
            10 MB (code INTERNAL_ERROR; #143).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /process/{key}/variable-hints:
    get:
      operationId: getProcessVariableHints
      tags: [Execution]
      summary: Deduplicated variable names and types seen in Operaton history for a process definition key
      description: >-
        Used by the Document Composer's BindingPanel for variable discovery.
        `key` is passed to Operaton unchecked: any non-empty value either
        succeeds (possibly with an empty `variables` array) or fails with a
        500 — there is no 400. Deduplicated by variable name, keeping the
        last-seen type; sorted by name.
      parameters:
        - name: key
          in: path
          required: true
          description: Process definition key, passed to Operaton unchecked.
          schema:
            type: string
      responses:
        '200':
          description: The deduplicated variables, sorted by name. Empty when none were seen.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, variables]
                properties:
                  success:
                    const: true
                  variables:
                    type: array
                    items:
                      type: object
                      required: [name, type]
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          description: >-
                            Operaton's own variable type (e.g. String, Integer,
                            Boolean, Double, Date, Json, Object, Null); not
                            validated or restricted by this API.
        '500':
          description: >-
            Fetching from Operaton failed (code VARIABLE_HINTS_FAILED). Unlike
            other operations' 500s, the message is a fixed string, not the
            underlying error, and the body has no `timestamp`.
          content:
            application/json:
              schema:
                type: object
                required: [success, error]
                properties:
                  success:
                    const: false
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        const: VARIABLE_HINTS_FAILED
                      message:
                        const: Failed to retrieve variable hints
  /chains:
    get:
      operationId: discoverChains
      tags: [Execution]
      summary: Pairwise DMN chain links, grouped by source DMN
      description: >-
        Discovers, via SPARQL, every DMN whose declared output variable
        matches another DMN's declared input variable, then groups those
        pairwise links by the source (`from`) DMN. Takes no parameters —
        `req.query` is never read — so there is nothing for the handler to
        reject with a 400. `chains` is `[]`, still with a 200, when no links
        are found.
      responses:
        '200':
          description: The chain links, grouped by source DMN. Empty when none exist.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [total, chains]
                    properties:
                      total:
                        type: integer
                        minimum: 0
                        description: '`chains.length`.'
                      chains:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChainMapEntry'
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The SPARQL lookup failed (code DISCOVERY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /chains/execute:
    post:
      operationId: executeChain
      tags: [Execution]
      summary: Execute a chain of DMNs sequentially, or a pre-assembled DRD in one call
      description: >-
        Threads each DMN's outputs into the next DMN's inputs, evaluating each
        one in Operaton in turn (`orchestrationService.executeChain`). When
        `isDrd` and `drdEntryPointId` are both given, that sequential
        execution is skipped entirely and all `inputs` are sent to Operaton's
        evaluation of the pre-assembled DRD in a single call instead. A step
        is only ever added to `steps` once it has completed successfully —
        `orchestration.service.ts` pushes it after its try/catch, and a step
        whose evaluation throws re-throws before that push is reached, so it
        is never added; the chain-level `error` carries that failure instead.
        Every populated `steps` entry therefore always has `outputs`, never
        `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dmnIds, inputs]
              properties:
                dmnIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >-
                    DMN identifiers to execute in order (or, for the DRD path,
                    the identifiers the DRD was assembled from). Required and
                    must not be empty.
                inputs:
                  type: object
                  minProperties: 1
                  description: >-
                    Free-form initial input variables. Required and must not
                    be an empty object.
                options:
                  type: object
                  description: >-
                    Only `includeIntermediateSteps` is read; `timeout` is
                    declared in the request type but never read anywhere and
                    has no effect.
                  properties:
                    includeIntermediateSteps:
                      type: boolean
                      description: When true, the response's `data` carries `steps`.
                endpoint:
                  type: string
                  description: >-
                    SPARQL endpoint URL to query instead of the configured
                    one, used to look up the chain's DMNs. Unvalidated, and
                    ignored when `isDrd` is true, because that path does not
                    look the DMNs up.
                isDrd:
                  type: boolean
                  description: >-
                    When true together with `drdEntryPointId`, executes the
                    pre-assembled DRD instead of the sequential chain.
                drdEntryPointId:
                  type: string
                  description: >-
                    The DRD's entry-point decision key, used only when `isDrd`
                    is also true.
      responses:
        '200':
          description: The chain (or DRD) completed successfully.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [success, chainId, executionTime, finalOutputs]
                    properties:
                      success:
                        const: true
                      chainId:
                        type: string
                        description: >-
                          The executed DMN identifiers joined with `->`, or,
                          for the DRD path, `DRD:<drdEntryPointId>`.
                      executionTime:
                        type: number
                        description: Milliseconds.
                      finalOutputs:
                        type: object
                        description: >-
                          Free-form: the accumulated chain variables once
                          every step has run, already unwrapped from
                          Operaton's `{value, type}` form.
                      steps:
                        type: array
                        description: Present only when the caller set `options.includeIntermediateSteps`.
                        items:
                          $ref: '#/components/schemas/ExecutionStep'
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: >-
            `dmnIds` is missing or empty (message "dmnIds array is required
            and must not be empty"), or `inputs` is missing or an empty
            object (message "inputs object is required"). Both are code
            INVALID_REQUEST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: >-
            Two unrelated causes share this status; see the schemas below.
            The nested-failure payload is the orchestrator resolving with
            `success: false`. `ErrorEnvelope` covers both the orchestrator
            call itself throwing and the route's own try/catch catching it
            (code EXECUTION_ERROR), and the request body not being valid
            JSON, or over 10 MB (code INTERNAL_ERROR; #143) — the latter
            never reaches this route's own handler; it is answered by the
            global error handler.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    description: >-
                      The orchestrator resolved with `success: false` (a DMN
                      in the chain threw, or the DRD evaluation threw). The
                      failure is nested under `data.error` as a plain string,
                      not the top-level `error` object of ErrorEnvelope.
                    required: [success, data, timestamp]
                    properties:
                      success:
                        const: false
                      data:
                        type: object
                        required: [success, chainId, executionTime, finalOutputs, error]
                        properties:
                          success:
                            const: false
                          chainId:
                            type: string
                          executionTime:
                            type: number
                            description: Milliseconds.
                          finalOutputs:
                            type: object
                            description: >-
                              Free-form: whatever chain variables had
                              accumulated before the failure. `{}` for a
                              failed DRD run.
                          steps:
                            type: array
                            description: Present only when the caller set `options.includeIntermediateSteps`. `[]` for a failed DRD run.
                            items:
                              $ref: '#/components/schemas/ExecutionStep'
                          error:
                            type: string
                            description: Always present on this shape.
                      timestamp:
                        type: string
                        format: date-time
                  - $ref: '#/components/schemas/ErrorEnvelope'
  /chains/templates:
    get:
      operationId: listChainTemplates
      tags: [Execution]
      summary: Predefined chain templates
      description: >-
        Templates are a fixed, in-memory list (three today), not sourced from
        the knowledge graph or a database; `endpoint` is accepted but has no
        effect on the result (reserved for future database-backed templates).
        `category` filters when given as a single string value; `tag` is only
        consulted when `category` is absent or not a single string. A
        repeated query parameter, or a category/tag that matches nothing,
        never answers 400 — it is ignored or yields an empty `templates`
        array. `categories` here is derived from the templates already
        returned, so it narrows along with a `category`/`tag` filter, unlike
        `GET /chains/templates/categories/list`, which always lists every
        category.
      parameters:
        - name: category
          in: query
          required: false
          description: Exact category match. Wins over `tag` when both are given.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Exact tag match. Only consulted when `category` is absent.
          schema:
            type: string
        - name: endpoint
          in: query
          required: false
          description: >-
            SPARQL endpoint URL to query instead of the configured one.
            Accepted but has no effect on predefined templates today.
          schema:
            type: string
      responses:
        '200':
          description: The templates, optionally filtered.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [total, templates, categories]
                    properties:
                      total:
                        type: integer
                        minimum: 0
                      templates:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChainTemplate'
                      categories:
                        type: array
                        items:
                          type: string
                        description: Deduplicated and sorted, derived from `templates` above.
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The template lookup failed (code QUERY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /chains/templates/{id}:
    get:
      operationId: getChainTemplate
      tags: [Execution]
      summary: One chain template by id
      description: >-
        `endpoint` is accepted but has no effect on the lookup today (same
        reservation as the list operation). On a hit, the handler also awaits
        an in-memory usage-count increment that is a documented no-op, so
        `usageCount` in the response never actually changes.
      parameters:
        - name: id
          in: path
          required: true
          description: The template's id.
          schema:
            type: string
        - name: endpoint
          in: query
          required: false
          description: >-
            SPARQL endpoint URL to query instead of the configured one.
            Accepted but has no effect on predefined templates today.
          schema:
            type: string
      responses:
        '200':
          description: The template.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ChainTemplate'
                  timestamp:
                    type: string
                    format: date-time
        '404':
          description: No template has this id (code NOT_FOUND). The message names the requested id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: The template lookup failed (code QUERY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /chains/templates/categories/list:
    get:
      operationId: listChainTemplateCategories
      tags: [Execution]
      summary: Every category used by a chain template
      description: >-
        Unfiltered: always every category across all predefined templates,
        unlike the `categories` field on `GET /chains/templates`, which
        narrows along with that operation's own filter.
      responses:
        '200':
          description: The categories, deduplicated and sorted.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [categories, total]
                    properties:
                      categories:
                        type: array
                        items:
                          type: string
                      total:
                        type: integer
                        minimum: 0
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The template lookup failed (code QUERY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /chains/templates/tags/list:
    get:
      operationId: listChainTemplateTags
      tags: [Execution]
      summary: Every tag used by a chain template
      description: >-
        Unfiltered: always every tag across all predefined templates. Mirrors
        `GET /chains/templates/categories/list`.
      responses:
        '200':
          description: The tags, deduplicated and sorted.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [tags, total]
                    properties:
                      tags:
                        type: array
                        items:
                          type: string
                      total:
                        type: integer
                        minimum: 0
                  timestamp:
                    type: string
                    format: date-time
        '500':
          description: The template lookup failed (code QUERY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  headers:
    ApiVersion:
      description: Full release version of the API (/core/version-header).
      required: true
      schema:
        type: string
        examples:
          - '2026.09.4'
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        The error body the backend returns today. Not RFC 9457 problem details;
        see https://github.com/sgort/linked-data-explorer/issues/131.
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [LIST_FAILED]
            message:
              type: string
            details:
              type: string
        timestamp:
          type: string
          format: date-time
    Health:
      type: object
      required:
        [name, version, environment, build, status, uptime, timestamp, services, shacl, documentation]
      properties:
        name:
          type: string
        version:
          type: string
          description: Release version; the same value as the API-Version header.
        environment:
          type: string
        build:
          $ref: '#/components/schemas/BuildInfo'
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        uptime:
          type: number
          description: Process uptime in seconds.
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          required: [triplydb, operaton]
          properties:
            triplydb:
              $ref: '#/components/schemas/DependencyStatus'
            operaton:
              $ref: '#/components/schemas/DependencyStatus'
        shacl:
          $ref: '#/components/schemas/ShaclLayerStatus'
        documentation:
          type: string
          examples: [/v1/openapi.json]
        error:
          type: string
          description: Present only when status is unhealthy.
    BuildInfo:
      type: object
      description: >-
        The build this instance runs, recorded in the deploy artifact (#122).
        isTracked is true only when both sha and run are present; otherwise the
        label is "local build".
      required: [sha, shortSha, run, isTracked, label]
      properties:
        sha:
          type: string
          description: Full commit SHA, or empty when untracked.
        shortSha:
          type: string
        run:
          type: string
          description: GitHub Actions run number, or empty when untracked.
        isTracked:
          type: boolean
        label:
          type: string
          examples: ['build 5530720 · #135', local build]
    DependencyStatus:
      type: object
      required: [status, latency, lastCheck]
      properties:
        status:
          type: string
          enum: [up, down, unknown]
        latency:
          type: number
          description: Round trip in milliseconds; 0 when not measured.
        lastCheck:
          type: string
          format: date-time
    ShaclLayerStatus:
      type: object
      description: >-
        Which SHACL shape layers loaded. Reported only; never changes the health
        status. `layers` is present when the status was read, `error` when
        reading it failed, and neither when the health check itself failed
        before reaching it (status unhealthy).
      required: [complete]
      properties:
        complete:
          type: boolean
        layers:
          type: object
          additionalProperties:
            type: object
            required: [label, loaded]
            properties:
              label:
                type: string
              loaded:
                type: boolean
        error:
          type: string
    PublicRopaRecord:
      type: object
      description: >-
        A record of processing activities as published. Closed: internal fields
        such as the controller and DPO contacts are never included.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - processLevel
        - title
        - controllerName
        - purpose
        - legalBasisUri
        - legalBasisLabel
        - gdprArticle
        - dataSubjects
        - recipients
        - thirdCountryTransfers
        - retentionPeriod
        - securityMeasures
        - status
        - personalDataFields
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        bpmnProcessId:
          type: string
        processLevel:
          type: string
          enum: [shell, subprocess]
        title:
          type: string
        controllerName:
          type: string
        purpose:
          type: string
        legalBasisUri:
          type: string
        legalBasisLabel:
          type: string
        gdprArticle:
          type: string
        dataSubjects:
          type: string
        recipients:
          type: string
        thirdCountryTransfers:
          type: boolean
        thirdCountryDetails:
          type: string
          description: Omitted when there are no third-country transfer details.
        retentionPeriod:
          type: string
        securityMeasures:
          type: string
        status:
          type: string
          const: active
        personalDataFields:
          type: array
          items:
            $ref: '#/components/schemas/RopaPersonalDataField'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RopaPersonalDataField:
      type: object
      additionalProperties: false
      required:
        [id, ropaRecordId, formId, fieldKey, fieldLabel, dataCategory, specialCategory, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        ropaRecordId:
          type: string
          format: uuid
        formId:
          type: string
        fieldKey:
          type: string
        fieldLabel:
          type: string
        dataCategory:
          type: string
        specialCategory:
          type: boolean
        sortOrder:
          type: integer
    PublicBundle:
      type: object
      description: A deployed shell or standalone process with its deployed artefacts.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - name
        - processRole
        - linkedDmnTemplates
        - status
        - deployedAt
        - deployedForms
        - deployedDocuments
        - subprocesses
        - updatedAt
      properties:
        id:
          type: string
        bpmnProcessId:
          type: string
        name:
          type: string
        description:
          type: string
        processRole:
          type: string
          enum: [shell, standalone]
        linkedDmnTemplates:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [example, wip, e2e]
        deployedAt:
          type: string
          format: date-time
        operatonUrl:
          type: string
        operatonDeploymentId:
          type: string
        deployedForms:
          type: array
          items:
            $ref: '#/components/schemas/NamedArtefact'
        deployedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/NamedArtefact'
        subprocesses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, bpmnProcessId, status]
            properties:
              id:
                type: string
              name:
                type: string
              bpmnProcessId:
                type: string
              status:
                type: string
                enum: [example, wip, e2e]
        language:
          type: string
          maxLength: 2
        organization:
          type: string
        boardOwner:
          type: string
        updatedAt:
          type: string
          format: date-time
    NamedArtefact:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Bpmn:
      type: object
      description: >-
        A stored BPMN process definition, as returned by
        `GET /assets/bpmn`. `GET /assets/bpmn/by-bpmn-id/{bpmnProcessId}`
        returns a narrower shape instead — see BpmnLookupResult.
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - name
        - xml
        - processRole
        - linkedDmnTemplates
        - status
        - readonly
        - schemaVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: The storage id (`lde_id`).
        bpmnProcessId:
          type: string
        name:
          type: string
        description:
          type: string
          description: Omitted when the stored value is null.
        xml:
          type: string
          description: The BPMN 2.0 XML. Not parsed or validated server-side.
        processRole:
          type: string
          enum: [shell, subprocess, standalone]
          description: Database CHECK constraint (process_definitions.process_role).
        calledElement:
          type: string
          description: Omitted when the stored value is null.
        shellId:
          type: string
          description: Omitted when the stored value is null.
        linkedDmnTemplates:
          type: array
          items:
            type: string
          description: Always present; an empty array when nothing is linked.
        status:
          type: string
          enum: [example, wip, e2e]
          description: Database CHECK constraint (process_definitions.status).
        readonly:
          type: boolean
        schemaVersion:
          type: integer
        language:
          type: string
          maxLength: 2
          description: Omitted when the stored value is null. Not a validated ISO-639-1 code.
        organization:
          type: string
          description: Omitted when the stored value is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BpmnLookupResult:
      type: object
      description: >-
        The narrow shape `GET /assets/bpmn/by-bpmn-id/{bpmnProcessId}`
        returns — built by hand from a 3-column SELECT, not the full Bpmn
        record the list operation returns.
      additionalProperties: false
      required: [id, bpmnProcessId, xml]
      properties:
        id:
          type: string
          description: The storage id (`lde_id`).
        bpmnProcessId:
          type: string
        xml:
          type: string
    Form:
      type: object
      description: >-
        A stored form schema, as returned by `GET /assets/forms`. The table
        holds a `schema_version` column, but `listForms`'s SELECT never
        reads it and `mapForm` never sets it — the field never appears on
        the wire, unlike `Document.schemaVersion`.
      additionalProperties: false
      required: [id, name, schema, status, createdAt, updatedAt, readonly]
      properties:
        id:
          type: string
          description: The storage id, a free-form TEXT primary key — not a UUID.
        name:
          type: string
        description:
          type: string
          description: Omitted when the stored value is null.
        schema:
          type: object
          description: >-
            Free-form JSON Schema-like form definition. A JSONB column —
            the driver returns it already parsed, not a JSON-encoded
            string, whatever the `FormRow` type comment claims. Not
            validated against any shape server-side.
        status:
          type: string
          description: >-
            No database CHECK constraint on this column and no fixed set
            of values in code — whatever was last written. Defaults to
            `wip` when a POST omits it.
        language:
          type: string
          maxLength: 2
          description: Omitted when the stored value is null. Not a validated ISO-639-1 code.
        organization:
          type: string
          description: Omitted when the stored value is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readonly:
          const: false
          description: Hardcoded by the mapper; never read from the database.
    Document:
      type: object
      description: A stored document template, as returned by `GET /assets/documents`.
      additionalProperties: false
      required:
        - id
        - name
        - schemaVersion
        - zones
        - bindings
        - assets
        - status
        - createdAt
        - updatedAt
        - readonly
      properties:
        id:
          type: string
          description: The storage id, a free-form TEXT primary key — not a UUID.
        name:
          type: string
        description:
          type: string
          description: Omitted when the stored value is null.
        processKey:
          type: string
          description: Stored as `process_key`. Omitted when the stored value is null.
        serviceId:
          type: string
          description: Stored as `service_id`. Omitted when the stored value is null.
        schemaVersion:
          type: integer
        zones:
          type: object
          description: >-
            Free-form JSON. A JSONB column — the driver returns it already
            parsed, not a JSON-encoded string, whatever the `DocumentRow`
            type comment claims.
        bindings:
          type: object
          description: >-
            Free-form JSON, arrays by convention but not enforced. Same
            JSONB/parsing note as `zones`.
        assets:
          type: object
          description: >-
            Free-form JSON, arrays by convention but not enforced. Same
            JSONB/parsing note as `zones`.
        status:
          type: string
          description: >-
            No database CHECK constraint on this column and no fixed set
            of values in code — whatever was last written. Defaults to
            `wip` when a POST omits it.
        language:
          type: string
          maxLength: 2
          description: Omitted when the stored value is null. Not a validated ISO-639-1 code.
        organization:
          type: string
          description: Omitted when the stored value is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readonly:
          const: false
          description: Hardcoded by the mapper; never read from the database.
    RopaRecord:
      type: object
      description: >-
        A stored RoPA record, as returned by `GET /assets/ropa` and
        `GET /assets/ropa/by-bpmn-id/{bpmnProcessId}`. A superset of
        PublicRopaRecord: adds the required controllerContact and
        schemaVersion and the optional dpoContact, none of which the public
        read exposes, and status is the open three-value set rather than
        the public read's `const: active` (a query filter on the public
        read, not a difference in what the database can hold).
      additionalProperties: false
      required:
        - id
        - bpmnProcessId
        - processLevel
        - title
        - controllerName
        - controllerContact
        - purpose
        - legalBasisUri
        - legalBasisLabel
        - gdprArticle
        - dataSubjects
        - recipients
        - thirdCountryTransfers
        - retentionPeriod
        - securityMeasures
        - status
        - schemaVersion
        - personalDataFields
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        bpmnProcessId:
          type: string
        processLevel:
          type: string
          enum: [shell, subprocess]
        title:
          type: string
        controllerName:
          type: string
        controllerContact:
          type: string
        dpoContact:
          type: string
          description: Omitted when the stored value is null.
        purpose:
          type: string
        legalBasisUri:
          type: string
        legalBasisLabel:
          type: string
        gdprArticle:
          type: string
        dataSubjects:
          type: string
        recipients:
          type: string
        thirdCountryTransfers:
          type: boolean
        thirdCountryDetails:
          type: string
          description: Omitted when there are no third-country transfer details.
        retentionPeriod:
          type: string
        securityMeasures:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
        schemaVersion:
          type: integer
        personalDataFields:
          type: array
          items:
            $ref: '#/components/schemas/RopaPersonalDataField'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CacheStats:
      type: object
      description: >-
        SPARQL result cache entries keyed by endpoint URL. `age` is the number of
        seconds since the entry was cached; `count` is the number of cached DMN
        records.
      additionalProperties:
        type: object
        required: [age, count]
        properties:
          age:
            type: integer
            minimum: 0
          count:
            type: integer
            minimum: 0
    NormsResult:
      type: object
      required: [total, dataset_versions, cprmv_version, aggregations, rules]
      properties:
        total:
          type: integer
          minimum: 0
          description: Number of rules in `rules`.
        dataset_versions:
          type: object
          description: Published dataset versions per ruleset id, newest first.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DatasetVersion'
        cprmv_version:
          type: string
          description: The CPRMV version the rule keys use.
          examples: ['0.3.0']
        aggregations:
          type: object
          required: [norms_per_rulesetid]
          properties:
            norms_per_rulesetid:
              type: object
              description: Number of rules per ruleset id.
              additionalProperties:
                type: integer
                minimum: 0
        rules:
          type: array
          description: >-
            Published rules. A rule's keys are IRIs in the requested CPRMV
            version's namespace (for example
            `https://cprmv.open-regels.nl/0.3.0/id`), plus `rulesetid`,
            `applicable_date`, `rulesetid_index`, `rule_id_path` and
            `rule_id_path_key`. A nested `contains` map, keyed by rule id, is
            present when the rule has children. The key set varies by version,
            so rules are described as open objects.
          items:
            type: object
    DatasetVersion:
      type: object
      required: [version, published_at, title]
      properties:
        version:
          type: [string, 'null']
          description: Null for rulesets other than the primary one.
        published_at:
          type: string
          description: Publication date as published in TriplyDB, normally ISO 8601; not reformatted.
        title:
          type: [string, 'null']
          description: Null for rulesets other than the primary one.
    TriplyDbError:
      type: object
      description: >-
        Error body of the TriplyDB proxy routes. Not `ErrorEnvelope`: `error` is a
        plain message and `status` repeats the HTTP status (#131).
      required: [success, error, status]
      properties:
        success:
          const: false
        error:
          type: string
        status:
          type: integer
    TriplyDbConfig:
      type: object
      description: TriplyDB connection settings supplied by the caller (#142).
      required: [baseUrl, account, dataset, apiToken]
      properties:
        baseUrl:
          type: string
          examples: ['https://api.open-regels.triply.cc']
        account:
          type: string
        dataset:
          type: string
        apiToken:
          type: string
    SparqlResults:
      type: object
      description: >-
        SPARQL 1.1 Query Results JSON as returned by the endpoint, unchanged:
        `head` and `results.bindings` for SELECT, `head` and `boolean` for ASK.
      properties:
        head:
          type: object
          properties:
            vars:
              type: array
              items:
                type: string
        results:
          type: object
          properties:
            bindings:
              type: array
              items:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/SparqlBinding'
        boolean:
          type: boolean
    SparqlBinding:
      type: object
      required: [value]
      properties:
        type:
          type: string
          examples: [uri]
        value:
          type: string
        datatype:
          type: string
        'xml:lang':
          type: string
    TriplyDbAsset:
      type: object
      required: [id, name, url, size, contentType]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          description: Download URL of the first version, or a constructed page URL when the asset has no versions.
        size:
          type: number
          minimum: 0
          description: Size of the first version in bytes, or 0 when there is none.
        contentType:
          type: string
          description: Always `image/png`; TriplyDB does not report the type.
    DmnModel:
      type: object
      required: [id, identifier, title, inputs, outputs, vendorCount, xmlUrl]
      properties:
        id:
          type: string
          description: IRI of the DMN.
        identifier:
          type: string
        title:
          type: string
        description:
          type: string
        deploymentId:
          type: string
        deployedAt:
          type: string
          description: As published in the knowledge graph; not reformatted.
        implementedBy:
          type: string
        lastTested:
          type: string
        testStatus:
          type: string
          description: Usually `passed`, `failed` or `pending`; read from the knowledge graph and not enforced.
        service:
          type: string
        serviceTitle:
          type: string
        organization:
          type: string
        organizationName:
          type: string
        logoUrl:
          type: string
        xmlUrl:
          type: string
          description: Relative link to the DMN XML download.
          examples: [/v1/dmns/SVB_LeeftijdsInformatie/xml]
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/DmnVariable'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/DmnVariable'
        validationStatus:
          type: string
          description: Usually `validated`, `in-review` or `not-validated`; read from the knowledge graph and not enforced.
        validatedBy:
          type: string
        validatedByName:
          type: string
        validatedAt:
          type: string
          description: As published in the knowledge graph; not reformatted.
        validationNote:
          type: string
        vendorCount:
          type: integer
          minimum: 0
    DmnVariable:
      type: object
      required: [identifier, title, type]
      properties:
        identifier:
          type: string
        title:
          type: string
        type:
          type: string
          description: Usually `String`, `Integer`, `Boolean`, `Date` or `Double`; read from the knowledge graph and not enforced.
        description:
          type: string
        testValue:
          type: [string, number, boolean, 'null']
          description: >-
            Example value, converted according to `type`. A non-numeric value for
            an Integer or Double variable serialises as null.
    SemanticEquivalence:
      type: object
      required: [sharedConcept, concept1, concept2, dmn1, dmn2]
      properties:
        sharedConcept:
          type: string
          description: IRI of the concept both variables refer to.
        concept1:
          $ref: '#/components/schemas/SemanticConcept'
        concept2:
          $ref: '#/components/schemas/SemanticConcept'
        dmn1:
          $ref: '#/components/schemas/DmnReference'
        dmn2:
          $ref: '#/components/schemas/DmnReference'
    SemanticConcept:
      type: object
      required: [uri, label, variable]
      properties:
        uri:
          type: string
        label:
          type: string
        notation:
          type: string
        variable:
          type: object
          required: [uri, identifier, type]
          properties:
            uri:
              type: string
            identifier:
              type: string
            type:
              type: string
              description: Read from the knowledge graph; not enforced.
    DmnReference:
      type: object
      required: [uri, title]
      properties:
        uri:
          type: string
        identifier:
          type: string
        title:
          type: string
    EnhancedChainLink:
      type: object
      required: [dmn1, dmn2, outputVariable, inputVariable, variableType, matchType, sharedConcept]
      properties:
        dmn1:
          $ref: '#/components/schemas/DmnReference'
        dmn2:
          $ref: '#/components/schemas/DmnReference'
        outputVariable:
          type: string
        inputVariable:
          type: string
        variableType:
          type: string
        matchType:
          type: string
          enum: [exact, semantic]
          description: A link that matches both ways is listed twice, once per match type.
        sharedConcept:
          type: string
    ChainCycle:
      type: object
      required: [path, type]
      properties:
        path:
          type: array
          minItems: 3
          items:
            $ref: '#/components/schemas/DmnReference'
        type:
          type: string
          enum: [three-hop, four-hop]
          description: Only `three-hop` cycles are detected today.
    OperatonDecisionResult:
      type: object
      description: One result row, mapping each output name to its typed value.
      additionalProperties:
        type: object
        required: [value, type]
        properties:
          value: {}
          type:
            type: string
            examples: [Boolean]
    OperatonProxyError:
      type: object
      description: Returned when Operaton could not be reached at all.
      required: [type, message]
      properties:
        type:
          const: ProxyError
        message:
          type: string
    DmnValidationResult:
      type: object
      required: [valid, parseError, layers, summary]
      properties:
        valid:
          type: boolean
          description: True when the XML parsed and no layer reported an error.
        parseError:
          type: [string, 'null']
        layers:
          type: object
          required: [base, business, execution, interaction, content]
          properties:
            base:
              $ref: '#/components/schemas/ValidationLayer'
            business:
              $ref: '#/components/schemas/ValidationLayer'
            execution:
              $ref: '#/components/schemas/ValidationLayer'
            interaction:
              $ref: '#/components/schemas/ValidationLayer'
            content:
              $ref: '#/components/schemas/ValidationLayer'
        summary:
          type: object
          required: [errors, warnings, infos]
          properties:
            errors:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
            infos:
              type: integer
              minimum: 0
    ValidationLayer:
      type: object
      required: [label, issues]
      properties:
        label:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
          examples: [BIZ-006]
        message:
          type: string
        location:
          type: string
        line:
          type: integer
        column:
          type: integer
    ShaclValidationResult:
      type: object
      description: >-
        `layers` is a closed set of exactly three shape layers — not a map,
        unlike the similarly-named ShaclLayerStatus block in /health.
      required: [valid, complete, parseError, layers, summary]
      properties:
        valid:
          type: boolean
          description: >-
            True only when the content parsed, every layer loaded, and no
            layer reported an error.
        complete:
          type: boolean
          description: True when every shape layer loaded. False on a parse error.
        parseError:
          type: [string, 'null']
        layers:
          type: object
          required: [cprmv, cpsv-ap, ronl-custom]
          properties:
            cprmv:
              $ref: '#/components/schemas/ShaclLayerResult'
            cpsv-ap:
              $ref: '#/components/schemas/ShaclLayerResult'
            ronl-custom:
              $ref: '#/components/schemas/ShaclLayerResult'
        summary:
          type: object
          required: [errors, warnings, infos]
          properties:
            errors:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
            infos:
              type: integer
              minimum: 0
    ShaclLayerResult:
      type: object
      required: [label, loaded, issues]
      properties:
        label:
          type: string
        loaded:
          type: boolean
          description: False when no shape files were present for this layer.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ShaclIssue'
    ShaclIssue:
      type: object
      required: [severity, code, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
          description: Derived at runtime from the SHACL constraint component IRI.
          examples: [SHACL-MAXCOUNT]
        message:
          type: string
        location:
          type: string
          description: Present only when the violation has a focus node or a path.
    ChainTemplate:
      type: object
      description: >-
        A predefined chain template, defined in code (TemplateService), not
        sourced from the knowledge graph. Serves both `GET /chains/templates`
        and `GET /chains/templates/{id}`.
      required:
        - id
        - name
        - description
        - type
        - category
        - dmnIds
        - tags
        - complexity
        - estimatedTime
        - createdAt
        - updatedAt
        - isPublic
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [sequential, drd]
          description: >-
            Fixed at the template's definition site; `drd` is reachable but
            unused by today's three predefined templates (all `sequential`).
        category:
          type: string
          enum: [social, financial, legal, custom]
          description: >-
            Fixed at the template's definition site; `legal` and `custom` are
            reachable but unused by today's three predefined templates.
        dmnIds:
          type: array
          items:
            type: string
        drdId:
          type: string
          description: >-
            Entry-point identifier for a `drd`-type template. Never set on
            today's templates (all `sequential`).
        drdDeploymentId:
          type: string
          description: >-
            Operaton deployment id for a `drd`-type template. Never set on
            today's templates (all `sequential`).
        defaultInputs:
          type: object
          description: >-
            Free-form: arbitrary keys, arbitrary JSON values. Today's
            templates spread saved test inputs from testData.json, plus a
            computed `dagVanAanvraag` date.
        tags:
          type: array
          items:
            type: string
        complexity:
          type: string
          enum: [simple, medium, complex]
          description: Fixed at the template's definition site.
        estimatedTime:
          type: number
          minimum: 0
          description: Milliseconds.
        usageCount:
          type: integer
          minimum: 0
          description: >-
            Hardcoded per template today. A successful `GET
            /chains/templates/{id}` awaits an increment that is a documented
            no-op, so this value never actually changes.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: >-
            Computed once, at process start (module load), not per request —
            effectively constant for the process's lifetime.
        author:
          type: string
        isPublic:
          type: boolean
    ChainMapEntry:
      type: object
      description: >-
        One source DMN and every downstream DMN it can feed, built by
        grouping the pairwise SPARQL chain links by their `from` DMN
        (chain.routes.ts, the handler's own local `ChainMapEntry`
        interface). Distinct from the DMN-record schemas of phase 2
        (DmnModel, DmnReference, EnhancedChainLink, ChainCycle).
      required: [from, connections]
      properties:
        from:
          type: string
          description: Source DMN identifier, from a SPARQL binding.
        connections:
          type: array
          items:
            type: object
            required: [to, variable, variableType]
            properties:
              to:
                type: string
                description: Downstream DMN identifier, from a SPARQL binding.
              variable:
                type: string
                description: The variable identifier that connects the two DMNs.
              variableType:
                type: string
                description: >-
                  The variable's declared type, from a SPARQL binding — a
                  plain string, never an enum.
    ExecutionStep:
      type: object
      description: >-
        One DMN evaluated within a chain execution. orchestration.service.ts
        only pushes a step onto `steps` after it has completed successfully;
        a step whose evaluation throws sets its own `error` field but is then
        discarded, re-thrown to the caller before that push runs, so it is
        never added to `steps`. Every step this API actually returns
        therefore always carries `outputs`, and `error` never appears here —
        unlike the `ExecutionStep` TypeScript type, which marks `outputs` and
        `error` as mutually-exclusive optionals.
      required: [dmnId, dmnTitle, startTime, endTime, duration, inputs, outputs]
      properties:
        dmnId:
          type: string
        dmnTitle:
          type: string
        startTime:
          type: number
          description: Epoch milliseconds.
        endTime:
          type: number
          description: Epoch milliseconds.
        duration:
          type: number
          description: Milliseconds; `endTime` minus `startTime`.
        inputs:
          type: object
          description: >-
            Free-form snapshot of the accumulated chain variables immediately
            before this step ran.
        outputs:
          type: object
          description: >-
            Free-form: this step's outputs, already unwrapped from Operaton's
            `{value, type}` form.
