              $ref: '#/components/headers/ApiVersion'
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    required: [deploymentId, entryPointId, filename, dmnCount]
                    properties:
                      deploymentId:
                        type: string
                      entryPointId:
                        type: string
                      filename:
                        type: string
                      dmnCount:
                        type: integer
                        minimum: 2
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: '`dmnIds` has fewer than two entries or `deploymentName` is blank (code INVALID_INPUT).'
          content:
