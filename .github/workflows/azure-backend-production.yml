name: Deploy Backend to Production

on:
  # NO pull_request trigger here, deliberately -- issue #46 asked for this to be
  # decided rather than left to drift, and the acc workflow got the opposite
  # answer.
  #
  # Two reasons, in order of weight:
  #
  # 1. This job declares `environment: production`, which carries
  #    required_reviewers and a branch policy. A pull_request trigger would
  #    make every pull request to main wait on a human approval BEFORE the
  #    tests could run -- an approval gate in front of the check meant to
  #    inform it, which is exactly backwards.
  #
  # 2. main is promoted from acc. A pull request here carries content that
  #    already ran lint, typecheck and the full suite on its acc pull request,
  #    so a second pre-merge run would re-test the same commits.
  #
  # The acc workflow is where pre-merge verification belongs; see the note on
  # its triggers. If main ever stops being promoted from acc, revisit this.
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
      - '.github/workflows/azure-backend-production.yml'
      # The root lockfile and manifest, so a lockfile-only promotion redeploys
      # rather than leaving production on the previous tree. See the acc
      # workflow and #97.
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

# Same serialisation as the acc workflow, but production runs QUEUE
# rather than cancel: interrupting a live production deployment to
# start another is worse than waiting for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://backend.linkeddata.open-regels.nl

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Install dependencies
        working-directory: packages/backend
        run: npm ci

      - name: Run linter
        working-directory: packages/backend
        run: npm run lint

      - name: Typecheck
        working-directory: packages/backend
        run: npm run typecheck

      - name: Unit tests
        working-directory: packages/backend
        run: npm test

      - name: Build TypeScript
        working-directory: packages/backend
        run: npm run build

      - name: Verify build output
        working-directory: packages/backend
        run: |
          echo "Checking built files..."
          ls -la dist/
          echo "Checking for v1 routes..."
          grep -n "v1/health" dist/routes/index.js || echo "ERROR: v1 routes not found!"
          grep -n "sparqlService" dist/routes/health.routes.js || echo "ERROR: sparqlService not found!"

      - name: Prepare deployment package
        working-directory: packages/backend
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p deploy
          
          # Copy the ENTIRE dist folder (preserve structure)
          cp -r dist deploy/
          
          # Copy package.json to deploy root (NOT inside dist)
          cp package.json deploy/

          # Record which build this artifact is, for /v1/health's `build` block.
          # package.json's version names the release, not the build (#122). It is
          # a file in the artifact rather than an App Service setting, because
          # settings persist across deploys and can describe a different build.
          jq -n --arg sha "$BUILD_SHA" --arg run "$BUILD_RUN" --arg runId "$BUILD_RUN_ID" \
            '{sha: $sha, run: $run, runId: $runId}' > deploy/build-info.json
          cat deploy/build-info.json

          # Copy SHACL shape files — read at runtime from <package-root>/shapes
          # (SHAPES_ROOT resolves to deploy/shapes via dist/services/../../shapes).
          # tsc does not emit these .ttl assets, so copy them explicitly.
          cp -r shapes deploy/
          
          # Fail here rather than ship a backend whose SHACL validator reports every
          # file "Not validated": the service starts without a missing layer. These
          # paths mirror LAYER_SPECS in src/services/shacl-validation.service.ts.
          for f in deploy/shapes/cpsv-ap/3.2.0/cpsv-ap-SHACL.ttl deploy/shapes/cprmv/0.4.1/cprmv.shacl.ttl; do
            if [ ! -s "$f" ]; then
              echo "❌ Missing SHACL shape file: $f"
              exit 1
            fi
          done
          if ! ls deploy/shapes/ronl/*.ttl > /dev/null 2>&1; then
            echo "❌ No SHACL shape files in deploy/shapes/ronl/"
            exit 1
          fi
          
          # Verify structure
          echo "Deployment structure:"
          ls -la deploy/
          ls -la deploy/dist/
          echo "SHACL shapes:"
          ls -R deploy/shapes/
          
          # Install production dependencies in deploy folder
          cd deploy
          npm install --production --omit=dev
          
          # Tell Azure not to rebuild (we already built)
          echo "[config]" > .deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> .deployment

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'ronl-linkeddata-backend-prod'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: './packages/backend/deploy'

      - name: Wait for deployment
        run: sleep 20

      - name: Health check
        run: |
          echo "Checking production backend health..."
          
          # Retry up to 5 times
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://backend.linkeddata.open-regels.nl/api/health)
            
            if [ "$response" = "200" ]; then
              echo "✅ Health check passed! Backend is healthy."
              exit 0
            fi
            
            echo "Attempt $i: Got HTTP $response, retrying in 10 seconds..."
            sleep 10
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Verify v1 endpoints
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Checking v1 endpoints..."
          
          # Test /v1/health
          v1_response=$(curl -s -o /dev/null -w "%{http_code}" https://backend.linkeddata.open-regels.nl/v1/health)
          
          if [ "$v1_response" = "200" ]; then
            echo "✅ /v1/health endpoint working!"
          else
            echo "⚠️ /v1/health returned HTTP $v1_response"
          fi
          
          # Build and SHACL shape layers: fail unless the running app is the build this
          # run deployed AND every shape layer loaded. /v1/health reports both without
          # degrading, so read the body at any HTTP code.
          # Allow about three minutes: the previous build keeps answering while Azure
          # starts the new one, and "Health check" above passes against either. On
          # 14 September the new build started 14s after a 34s window had given up.
          # build.sha tells the two builds apart directly (#122); without it, a deploy
          # that left the previous artifact serving would pass. A null value means a
          # response from a build that predates the block.
          running_sha=""
          shacl_complete=""
          for attempt in $(seq 1 12); do
            body=$(curl -s -m 10 https://backend.linkeddata.open-regels.nl/v1/health || true)
            running_sha=$(printf '%s' "$body" | jq -r '.build.sha' 2>/dev/null || true)
            shacl_complete=$(printf '%s' "$body" | jq -r '.shacl.complete' 2>/dev/null || true)
            [ "$running_sha" = "$EXPECTED_SHA" ] && [ "$shacl_complete" = "true" ] && break
            echo "Attempt $attempt/12: build.sha is ${running_sha:-unreadable}, shacl.complete is ${shacl_complete:-unreadable}"
            [ "$attempt" -lt 12 ] && sleep 15
          done

          if [ "$running_sha" = "$EXPECTED_SHA" ]; then
            echo "✅ Running build is $EXPECTED_SHA"
          else
            echo "❌ Running build is ${running_sha:-unreadable}, expected $EXPECTED_SHA: the deploy did not take effect"
            curl -s https://backend.linkeddata.open-regels.nl/v1/health | jq '.build' || true
            exit 1
          fi

          if [ "$shacl_complete" = "true" ]; then
            echo "✅ SHACL shape layers all loaded"
          else
            echo "❌ SHACL shape layers incomplete (shacl.complete: ${shacl_complete:-unreadable})"
            curl -s https://backend.linkeddata.open-regels.nl/v1/health | jq '.shacl' || true
            exit 1
          fi
          
          # Test /v1/dmns
          v1_dmns=$(curl -s -o /dev/null -w "%{http_code}" https://backend.linkeddata.open-regels.nl/v1/dmns)
          
          if [ "$v1_dmns" = "200" ]; then
            echo "✅ /v1/dmns endpoint working!"
          else
            echo "⚠️ /v1/dmns returned HTTP $v1_dmns"
          fi

      - name: Deployment success
        if: success()
        run: |
          echo "🚀 Backend successfully deployed to production!"
          echo "URL: https://backend.linkeddata.open-regels.nl"
          echo "API v1: https://backend.linkeddata.open-regels.nl/v1/health"
          echo "Legacy API: https://backend.linkeddata.open-regels.nl/api/health"