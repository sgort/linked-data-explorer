name: Deploy Frontend to Production

on:
  # Called by promote-to-production.yml AFTER the backend has deployed, so the
  # site never serves new pages against an old API (#210). The `push` trigger
  # that used to be here is what made the two race; its path filter now lives
  # in scripts/promotion-targets.mjs, which decides for all three deploys.
  workflow_call:
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BEACH_0A7CFA203:
        required: true
  # The pull_request trigger stays, and is NOT part of the promotion sequence:
  # it builds a preview of the production site from the promotion pull request,
  # so the real thing can be looked at before anything is promoted. Decided in
  # #210 and written up in SECURITY-PIPELINE.md, together with what it costs.
  # These paths are the reference copy of the frontend filter --
  # scripts/promotion-targets.test.mjs fails if the two stop agreeing.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-production.yml'
      - 'package-lock.json'
      - 'package.json'
      - '.nvmrc'

# Same serialisation as the acc workflow, but production runs QUEUE
# rather than cancel: interrupting a live production deployment to
# start another is worse than waiting for it.
#
# Named explicitly rather than with `github.workflow`: in a called workflow
# that expression resolves to the CALLER's name, so the three production
# deploys would share one group and queue behind each other.
concurrency:
  group: deploy-frontend-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    # Runs for every trigger EXCEPT a pull request being closed (the close job
    # below handles that). Phrased as an exclusion rather than
    # `event_name == 'push'`: when this workflow is CALLED, github.event_name is
    # the caller's event, so a promotion started by workflow_dispatch would have
    # skipped the deploy outright.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-24.04
    name: Build and Deploy Production Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc; see azure-frontend-acc.yml. This pin now decides
          # the Node that builds what production serves.
          node-version-file: .nvmrc
          cache: "npm"
      # Installing from the workspace root, since the only lockfile is there.
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint --workspace=packages/frontend
      - name: Typecheck
        run: npm run typecheck --workspace=packages/frontend
      - name: Unit tests
        run: npm test --workspace=packages/frontend
      # Built on the runner and uploaded with skip_app_build, so what ships is
      # the build the tests ran against. See azure-frontend-acc.yml and #119.
      - name: Build frontend for production
        working-directory: packages/frontend
        # See azure-frontend-acc.yml for why these are injected rather than
        # derived from git. On a promotion -- called from a push to main --
        # github.sha is the real commit being promoted. On the preview build
        # from a promotion pull request it is the synthesised merge commit,
        # which is the right sha for a preview: it identifies what the preview
        # actually contains, not what main holds today.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:prod
          test -f dist/index.html || { echo "::error::dist/index.html not found after build"; exit 1; }
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BEACH_0A7CFA203 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build, app_location is the built output itself.
          app_location: "/packages/frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BEACH_0A7CFA203 }}
          action: "close"
