name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-production.yml'
      # The root lockfile and manifest, so a lockfile-only promotion redeploys
      # rather than leaving production on the previous tree. See the acc
      # workflow and #97.
      - 'package-lock.json'
      - 'package.json'
      # .nvmrc sets the Node version this workflow builds, tests and ships on.
      # Without it here, a Node bump built and deployed nothing (#119).
      - '.nvmrc'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-production.yml'
      - 'package-lock.json'
      - 'package.json'
      - '.nvmrc'

# Same serialisation as the acc workflow, but production runs QUEUE
# rather than cancel: interrupting a live production deployment to
# start another is worse than waiting for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build and Deploy Production Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc; see azure-frontend-acc.yml. This pin now decides
          # the Node that builds what production serves.
          node-version-file: .nvmrc
          cache: "npm"
      # Installing from the workspace root, since the only lockfile is there.
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint --workspace=packages/frontend
      - name: Typecheck
        run: npm run typecheck --workspace=packages/frontend
      - name: Unit tests
        run: npm test --workspace=packages/frontend
      # Built on the runner and uploaded with skip_app_build, so what ships is
      # the build the tests ran against. See azure-frontend-acc.yml and #119.
      - name: Build frontend for production
        working-directory: packages/frontend
        # See azure-frontend-acc.yml for why these are injected rather than
        # derived from git. Production deploys from a push to main, so
        # github.sha is a real commit here, never a synthesised merge commit.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:prod
          test -f dist/index.html || { echo "::error::dist/index.html not found after build"; exit 1; }
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BEACH_0A7CFA203 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build, app_location is the built output itself.
          app_location: "/packages/frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_BEACH_0A7CFA203 }}
          action: "close"
