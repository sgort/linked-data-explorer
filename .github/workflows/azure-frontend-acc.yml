name: Deploy Frontend to Acceptance

on:
  push:
    branches:
      - acc
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-acc.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - acc
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-acc.yml'

# Serialise deployments to one environment. Keyed on the pull-request
# NUMBER rather than the ref: keyed on github.ref alone, the
# pull_request(closed) teardown and the push deploy that a merge fires
# simultaneously land in one group and cancel each other at random.
# Learned in ronl-business-api on 2026-08-29.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          submodules: true
          persist-credentials: false
          lfs: false
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
      # The Static Web Apps action builds inside its own container and runs
      # none of our scripts, so lint and tests get explicit steps ahead of it.
      # Installing from the workspace root, since the only lockfile is there.
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint --workspace=packages/frontend
      - name: Typecheck
        run: npm run typecheck --workspace=packages/frontend
      - name: Unit tests
        run: npm test --workspace=packages/frontend
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BAY_04F351E03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/packages/frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Output folder RELATIVE to app_location
          app_build_command: "npm run build:acc" # Explicit ACC build
      ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BAY_04F351E03 }}
          action: "close"
