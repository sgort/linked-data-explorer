name: Deploy Frontend to Acceptance

on:
  push:
    branches:
      - acc
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-acc.yml'
      # The root lockfile and manifest, because every workspace resolves through
      # them. Without these, a lockfile-only change -- Renovate's lock-file
      # maintenance above all -- was built, tested and deployed by nothing: #92
      # moved 338 packages, 82 of them runtime, and CI ran audit and scan alone.
      # A backend-only bump reaches this workflow too, because the lockfile is
      # shared and a hoisted dependency can move under either workspace. #97.
      - 'package-lock.json'
      - 'package.json'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - acc
    paths:
      - 'packages/frontend/**'
      - '.github/workflows/azure-frontend-acc.yml'
      - 'package-lock.json'
      - 'package.json'

# Serialise deployments to one environment. Keyed on the pull-request
# NUMBER rather than the ref: keyed on github.ref alone, the
# pull_request(closed) teardown and the push deploy that a merge fires
# simultaneously land in one group and cancel each other at random.
# Learned in ronl-business-api on 2026-08-29.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, the one place this repository states its Node
          # version; the backend workflows read the same file. Until #119 this
          # was a literal 20.20.2 that governed lint and tests only, because
          # Oryx built the shipped bundle on a Node it chose itself (22.22.0 in
          # run 34612031473). Now the runner builds, so this pin decides what
          # ships. See #113.
          node-version-file: .nvmrc
          cache: "npm"
      # Installing from the workspace root, since the only lockfile is there.
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint --workspace=packages/frontend
      - name: Typecheck
        run: npm run typecheck --workspace=packages/frontend
      - name: Unit tests
        run: npm test --workspace=packages/frontend
      # The bundle is built HERE, from the tree `npm ci` installed and on the
      # Node the tests just ran on, and uploaded as-is with skip_app_build.
      # Until #119 the deploy action built it instead: Oryx ran `npm install`
      # inside the floating staticappsclient:stable container, re-resolving
      # the lockfile's ranges on a Node version this repository never chose.
      # So the code that passed the tests and the code that shipped were two
      # different builds. ICTU recommendations 2, 3 and 4; RONL Business API
      # has always built this way.
      - name: Build frontend for ACC
        working-directory: packages/frontend
        # Stamps the bundle with which BUILD it is, not just which release —
        # the changelog version is authored at release time, so ACC and
        # production can serve different builds of the same version string.
        # Vite merges VITE_-prefixed process.env over .env.acceptance.
        #
        # Nothing is derived from git at build time, although the runner now
        # has .git: the values are injected so that buildInfo.ts has exactly
        # one source, and a build id that silently fails to resolve is worse
        # than none.
        #
        # Absent (local builds, forks), src/utils/buildInfo.ts renders
        # 'local build'. On a pull request github.sha is the merge commit
        # GitHub synthesises, so a preview's SHA matches no commit in the
        # branch — that is the commit that was built, not a bug to chase.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:acc
          test -f dist/index.html || { echo "::error::dist/index.html not found after build"; exit 1; }
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BAY_04F351E03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build, app_location is the built output itself.
          app_location: "/packages/frontend/dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_BAY_04F351E03 }}
          action: "close"
